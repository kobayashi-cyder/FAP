<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>FAP Media Lab V87.33</title>
<style>
:root{--panel:#0d1a17;--line:#223a34;--text:#eef7f3;--muted:#8fa79f;--ok:#47df8d;--warn:#f0bb4d;--bad:#ff7474}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#173a30 0,#07110f 40%,#030806 100%);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:1240px;margin:auto;padding:18px 16px 50px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.brand{font-size:20px;font-weight:850;letter-spacing:.08em}.badge{border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:minmax(320px,410px) 1fr;gap:16px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:rgba(13,26,23,.93);border:1px solid var(--line);border-radius:18px;padding:16px}label{display:block;color:var(--muted);margin:0 0 6px}
textarea,input{width:100%;background:#07110f;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;outline:none}textarea{min-height:128px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.field{margin-top:12px}
button{width:100%;margin-top:16px;border:0;border-radius:13px;padding:12px 16px;background:#e7f3eb;color:#06100d;font-weight:850;cursor:pointer}
.preview{min-height:430px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:15px;overflow:hidden;background:#050b09}.preview img{display:block;max-width:100%;max-height:72vh}.empty{color:var(--muted);text-align:center;padding:35px}
.meta{margin-top:13px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kv{background:#08130f;border:1px solid var(--line);border-radius:11px;padding:9px}.k{color:var(--muted);font-size:11px}.v{overflow-wrap:anywhere;margin-top:2px}
.note{margin-top:7px;color:#b3c2bc;font-size:12px}.notice{margin-top:12px;padding:10px;border-radius:12px;background:#111913;color:#b9c9c3}.engine{margin-top:8px;padding:8px;border-left:2px solid var(--line);color:var(--muted)}.issue{border:1px solid #5b3535;background:#1b1111;border-radius:10px;padding:8px;margin-top:6px;color:#ffb0b0}
</style>
</head>
<body>
<main>
<div class="top"><div class="brand">FAP MEDIA LAB</div><div id="version" class="badge">V--</div><div id="state" class="badge">CHECKING</div></div>
<div class="grid">
<section class="card">
<div class="field"><label>Prompt</label><textarea id="prompt" placeholder="例: 鳥と犬"></textarea></div>
<div class="row"><div><label>最大試行</label><input id="attempts" type="number" min="1" max="8" value="2"></div><div><label>Width</label><input id="width" type="number" value="1024"></div></div>
<div class="row"><div><label>Height</label><input id="height" type="number" value="1024"></div><div></div></div>
<div class="field">
<label>Hard constraints（1行1件）</label>
<textarea id="constraints" placeholder="例（入力しない限り適用されません）:&#10;被写体を中央に保つ&#10;写真風"></textarea>
<div class="note">薄い文字は入力例です。実際に入力した行だけが制約として送信されます。</div>
</div>
<button id="generate">FAPで生成</button>
<div class="notice">V87.33: human / dog / bird / cat / horse / car をObject Registryから生成します。写真風を実入力した場合はphoto-look判定へ渡り、未検証フォトリアルは引き続きNOT ACCEPTEDです。</div>
<div class="field"><label>接続エンジン</label><div id="engines"></div></div>
</section>
<section class="card">
<div id="preview" class="preview"><div class="empty">生成結果がここに表示されます。</div></div>
<div id="meta" class="meta"></div><div id="issues"></div>
</section>
</div>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s),state=$('#state'),button=$('#generate');
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
function kv(k,v){const d=document.createElement('div');d.className='kv';d.innerHTML='<div class="k"></div><div class="v"></div>';d.children[0].textContent=k;d.children[1].textContent=Array.isArray(v)?v.join(', '):String(v??'—');return d}
async function status(){const s=await api('/api/v1/status');$('#version').textContent='V'+s.version;state.textContent=s.state.toUpperCase();state.className='badge '+(s.state==='ready'?'ok':'bad');const b=$('#engines');b.innerHTML='';for(const x of s.skills||[]){const d=document.createElement('div');d.className='engine';d.textContent=x.engine_id+' · objects '+(x.supported_scene_objects||[]).join('/')+' · '+x.render_style;b.append(d)}}
button.onclick=async()=>{
button.disabled=true;button.textContent='生成中...';
try{
const payload={prompt:$('#prompt').value,media_type:'image',width:+$('#width').value,height:+$('#height').value,max_attempts:+$('#attempts').value,constraints:$('#constraints').value};
const d=await api('/api/v1/generate',{method:'POST',body:JSON.stringify(payload)}),a=d.artifact;
const p=$('#preview');p.innerHTML='';if(a){const img=document.createElement('img');img.src=a.url+'?t='+Date.now();p.append(img)}else p.innerHTML='<div class="empty">Artifactなし</div>';
const m=$('#meta');m.innerHTML='';
[['status',d.status],['backend',a?.backend_id],['constraints sent',d.constraints_received],['integrity',a?.integrity_score],['objects',a?.object_score],['layout',a?.layout_score],['style score',a?.style_score],['required objects',a?.required_objects],['generated objects',a?.generated_objects],['requested style',a?.requested_styles],['render style',a?.render_style],['composite score',a?.verification_score]].forEach(([k,v])=>m.append(kv(k,v)));
const ib=$('#issues');ib.innerHTML='';for(const i of a?.issues||[]){const x=document.createElement('div');x.className='issue';x.textContent=i.code+' ['+i.severity+'] '+i.detail;ib.append(x)}
state.textContent=d.accepted?'ACCEPTED':'NOT ACCEPTED';state.className='badge '+(d.accepted?'ok':'bad');
}catch(e){state.textContent='ERROR';state.className='badge bad';alert(e.message)}finally{button.disabled=false;button.textContent='FAPで生成'}
};
status();
})();
</script>
</body>
</html>
