<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>FAP DNA Lab</title>
<style>body{margin:0;background:#07110f;color:#eef7f3;font:14px system-ui;padding:18px}main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:380px 1fr;gap:16px}.card{background:#0d1a17;border:1px solid #223a34;border-radius:16px;padding:16px}textarea,input{width:100%;box-sizing:border-box;background:#07110f;color:#eef7f3;border:1px solid #223a34;border-radius:10px;padding:10px;margin:5px 0 12px}button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800}.preview{min-height:500px;display:grid;place-items:center;border:1px dashed #223a34;border-radius:12px}.preview img{max-width:100%;max-height:72vh}.meta{white-space:pre-wrap;color:#b9c9c3}</style></head><body><main><h2>FAP V87.36 — Scientific DNA</h2><div class="grid"><section class="card"><label>Prompt</label><textarea id="p">20塩基対のB-DNA、配列: ATGCCGTAGCTAACGTTGCA、斜めから</textarea><label>Width</label><input id="w" value="768"><label>Height</label><input id="h" value="768"><button id="go">生成・検証</button><p>B-DNAは塩基対数・相補性・右巻き・直径・rise・bp/turn・pitchを検証します。</p></section><section class="card"><div id="prev" class="preview">生成結果</div><pre id="meta" class="meta"></pre></section></div></main><script>
const $=s=>document.querySelector(s);async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
$('#go').onclick=async()=>{const d=await api('/api/v1/generate',{method:'POST',body:JSON.stringify({prompt:$('#p').value,width:+$('#w').value,height:+$('#h').value})});const a=d.artifact;const p=$('#prev');p.innerHTML='';if(a){const im=document.createElement('img');im.src=a.url+'?t='+Date.now();p.append(im)}$('#meta').textContent=JSON.stringify(d,null,2)};</script></body></html>
