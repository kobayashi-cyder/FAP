<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>FAP Chat</title>
<style>
:root{--bg:#06110f;--panel:#0b1714;--line:#1c332d;--text:#e8f2ef;--muted:#8da39d;--accent:#26d07c;--warn:#f0b429;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#123129 0,#07130f 40%,#040b09 100%);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Noto Sans JP",sans-serif}
.app{min-height:100dvh;max-width:820px;margin:auto;display:grid;grid-template-rows:auto 1fr auto}
header{position:sticky;top:0;z-index:2;padding:14px 16px;background:rgba(6,17,15,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head{display:flex;gap:10px;align-items:center}.brand{font-weight:800;letter-spacing:.08em}.badge{padding:3px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.badge.ready{color:#76f3ad;border-color:#2b7d50}.badge.warn{color:#ffd36a;border-color:#775f22}.badge.bad{color:#ff8b8b;border-color:#6f2d2d}
.meta{margin-top:6px;color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
main{padding:18px 14px 120px;overflow:auto}.msg{margin:0 0 18px}.who{font-size:11px;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}.bubble{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user .bubble{font-size:17px;font-weight:650}.msg.fap .bubble{font-size:16px}.msg.minus{padding-left:14px;border-left:2px solid #475b56}.msg.minus .bubble{color:#c4d1cd;font-size:13px}
.trace{margin-top:8px;font-size:11px;color:var(--muted)}.artifact{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#08110f}
.artifact img,.artifact video{display:block;max-width:100%;height:auto}.artifact audio{width:100%}.artifact a{display:block;padding:12px;color:#82e7b0;text-decoration:none}
footer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(4,11,9,.96) 18%);padding:24px 12px max(12px,env(safe-area-inset-bottom))}
.composer{max-width:820px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px;background:#0b1714;border:1px solid var(--line);border-radius:18px;padding:9px}
textarea{resize:none;min-height:46px;max-height:170px;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:10px}
button{border:0;border-radius:13px;background:#e7efe7;color:#06110f;font-weight:800;padding:0 18px;cursor:pointer}button:disabled{opacity:.45}
.actions{max-width:820px;margin:0 auto 7px;display:flex;gap:7px;justify-content:flex-end}.ghost{background:#10211d;color:#bcd0ca;border:1px solid var(--line);padding:6px 10px;font-size:12px}
.empty{color:var(--muted);text-align:center;padding:15vh 18px}.err{color:#ff9b9b}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="head">
    <div class="brand">FAP CHAT</div>
    <div id="version" class="badge">version ?</div>
    <div id="state" class="badge warn">CONNECTING</div>
  </div>
  <div class="meta"><span id="ability">ability: —</span><span id="confidence">confidence: —</span><span id="sessionLabel"></span></div>
</header>
<main id="log"><div id="empty" class="empty">FAP Coreへ接続しています。</div></main>
</div>
<footer>
  <div class="actions">
    <button id="reconnect" class="ghost" type="button">再接続</button>
    <button id="clear" class="ghost" type="button">表示を消去</button>
  </div>
  <form id="form" class="composer">
    <textarea id="input" rows="1" placeholder="FAPへ指示・質問"></textarea>
    <button id="send" type="submit">送信</button>
  </form>
</footer>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const log=$('#log'), input=$('#input'), send=$('#send'), empty=$('#empty');
// Transport only: when downloaded/opened as content:// or file://, talk to the loopback FAP Core.
// FAP abilities remain entirely on the Core side.
const LOCAL_DOCUMENT = !/^https?:$/.test(location.protocol);
const API_BASE = LOCAL_DOCUMENT ? 'http://127.0.0.1:11439' : '';
const api = path => API_BASE + path;
const SESSION_KEY='fap.chat.session.v1';
let session=localStorage.getItem(SESSION_KEY);
if(!session){session='s_'+crypto.getRandomValues(new Uint32Array(2)).join('_');localStorage.setItem(SESSION_KEY,session)}
$('#sessionLabel').textContent='session: '+session.slice(-12);

function esc(s){return String(s??'')}
function setState(text,kind='warn'){const e=$('#state');e.textContent=text;e.className='badge '+kind}
function renderArtifact(a){
  if(!a||!a.type)return;
  const box=document.createElement('div');box.className='artifact';
  const rawSrc=a.src||a.url||'';
  const src=(LOCAL_DOCUMENT&&rawSrc.startsWith('/'))?API_BASE+rawSrc:rawSrc;
  if(a.type==='image'&&src){const x=document.createElement('img');x.src=src;x.alt=a.name||'generated image';box.append(x)}
  else if(a.type==='audio'&&src){const x=document.createElement('audio');x.controls=true;x.src=src;box.append(x)}
  else if(a.type==='video'&&src){const x=document.createElement('video');x.controls=true;x.src=src;box.append(x)}
  else if(src){const x=document.createElement('a');x.href=src;x.target='_blank';x.rel='noopener';x.textContent=a.name||src;box.append(x)}
  else {const x=document.createElement('pre');x.textContent=JSON.stringify(a,null,2);box.append(x)}
  return box;
}
function add(role,text,meta={},artifacts=[]){
  if(empty) empty.remove();
  const wrap=document.createElement('article');wrap.className='msg '+role;
  const who=document.createElement('div');who.className='who';who.textContent=role==='user'?'YOU':role==='minus'?'FAP-':'FAP';
  const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=esc(text);
  wrap.append(who,bubble);
  if(meta&&Object.keys(meta).length){const t=document.createElement('div');t.className='trace';t.textContent=Object.entries(meta).filter(([,v])=>v!==undefined&&v!==null&&v!=='').map(([k,v])=>k+': '+v).join(' · ');wrap.append(t)}
  for(const a of artifacts||[]){const node=renderArtifact(a);if(node)wrap.append(node)}
  log.append(wrap);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
async function jsonFetch(url,opt={}){
  const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});
  const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={error:text||('HTTP '+r.status)}}
  if(!r.ok)throw new Error(data.error||data.message||('HTTP '+r.status));return data;
}
async function status(){
  setState('CONNECTING','warn');
  try{
    const s=await jsonFetch(api('/api/v1/status'),{method:'GET'});
    $('#version').textContent='v'+(s.version||'?');
    setState((s.state||'READY').toUpperCase(),s.state==='degraded'?'warn':'ready');
    if(Array.isArray(s.capabilities)) $('#ability').textContent='abilities: '+s.capabilities.length;
  }catch(e){
    setState('CORE OFFLINE','bad');
    $('#version').textContent='version ?';
    add('fap','FAP Coreへ接続できません。Coreを起動し、Android接続時はADB reverseを有効にしてください。HTML側には推論能力を置いていません。',{endpoint:api('/api/v1/status'),error:e.message});
  }
}
async function submit(text){
  text=String(text||'').trim();if(!text)return;
  add('user',text);input.value='';resize();send.disabled=true;
  try{
    const d=await jsonFetch(api('/api/v1/chat'),{method:'POST',body:JSON.stringify({text,session,client:{name:'FAP_Chat',protocol:'1.0'}})});
    $('#ability').textContent='ability: '+(d.ability||'chat');
    $('#confidence').textContent='confidence: '+(typeof d.confidence==='number'?d.confidence.toFixed(2):'—');
    add('fap',d.reply||'',{ability:d.ability,route:Array.isArray(d.route)?d.route.join(' → '):d.route},d.artifacts||[]);
    if(d.critic) add('minus',d.critic,{verdict:d.verdict||''});
    if(d.status&&d.status.state)setState(String(d.status.state).toUpperCase(),d.status.state==='degraded'?'warn':'ready');
  }catch(e){add('fap','Core処理に失敗しました。',{error:e.message});setState('DEGRADED','warn')}
  finally{send.disabled=false;input.focus()}
}
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,170)+'px'}
$('#form').addEventListener('submit',e=>{e.preventDefault();submit(input.value)});
input.addEventListener('input',resize);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit(input.value)}});
$('#reconnect').onclick=status;
$('#clear').onclick=()=>{log.innerHTML='<div id="empty" class="empty">表示を消去しました。FAP側の記憶は変更していません。</div>'};
status();input.focus();
})();
</script>
</body>
</html>
