<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>FAP Media Lab V87.34</title>
<style>
:root{--p:#0d1a17;--l:#223a34;--t:#eef7f3;--m:#8fa79f;--ok:#47df8d;--bad:#ff7474}*{box-sizing:border-box}
body{margin:0;background:#07110f;color:var(--t);font:14px/1.5 system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:1260px;margin:auto;padding:18px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:16px}.brand{font-size:20px;font-weight:850}.badge{border:1px solid var(--l);border-radius:999px;padding:4px 9px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:410px 1fr;gap:16px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:16px}
label{display:block;color:var(--m);margin:10px 0 6px}textarea,input{width:100%;background:#07110f;color:var(--t);border:1px solid var(--l);border-radius:11px;padding:10px;font:inherit}textarea{min-height:120px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;font-weight:800}
.preview{min-height:430px;border:1px dashed var(--l);border-radius:14px;display:grid;place-items:center;overflow:hidden}.preview img{max-width:100%;max-height:72vh}
.meta{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kv{border:1px solid var(--l);border-radius:10px;padding:8px}.k{color:var(--m);font-size:11px}.issue{margin-top:6px;padding:8px;border:1px solid #633;background:#1b1111;border-radius:9px;color:#ffb0b0}.note{color:var(--m);font-size:12px;margin-top:8px}
</style></head><body><main>
<div class="top"><div class="brand">FAP MEDIA LAB</div><div id="ver" class="badge">V--</div><div id="state" class="badge">CHECKING</div></div>
<div class="grid"><section class="card">
<label>Prompt</label><textarea id="prompt">2羽の白い鳥が犬の上を飛んでいて、犬は鳥を見ている。側面から。</textarea>
<div class="row"><div><label>Width</label><input id="w" type="number" value="1024"></div><div><label>Height</label><input id="h" type="number" value="1024"></div></div>
<label>Hard constraints</label><textarea id="constraints" placeholder="例: 猫は入れない&#10;写真風"></textarea>
<div class="note">V87.34: 個数・色・状態・関係・除外・視点をScene Graph 2で検証します。</div>
<button id="go">生成</button></section>
<section class="card"><div id="preview" class="preview">生成結果</div><div id="meta" class="meta"></div><div id="issues"></div></section></div>
<script>
const $=s=>document.querySelector(s);
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
function kv(k,v){const d=document.createElement('div');d.className='kv';d.innerHTML='<div class="k"></div><div></div>';d.children[0].textContent=k;d.children[1].textContent=typeof v==='object'?JSON.stringify(v):String(v??'—');return d}
(async()=>{const s=await api('/api/v1/status');$('#ver').textContent='V'+s.version;$('#state').textContent=s.state.toUpperCase();$('#state').className='badge ok'})();
$('#go').onclick=async()=>{const b=$('#go');b.disabled=true;try{const d=await api('/api/v1/generate',{method:'POST',body:JSON.stringify({prompt:$('#prompt').value,constraints:$('#constraints').value,width:+$('#w').value,height:+$('#h').value,max_attempts:1})});const a=d.artifact,p=$('#preview');p.innerHTML='';if(a){const im=document.createElement('img');im.src=a.url+'?t='+Date.now();p.append(im)}const m=$('#meta');m.innerHTML='';[['status',d.status],['count',a?.count_score],['attributes',a?.attribute_score],['state',a?.state_score],['relations',a?.relation_score],['negative',a?.negative_score],['viewpoint',a?.viewpoint_score],['style',a?.style_score],['required counts',a?.required_counts],['generated counts',a?.generated_counts],['relations required',a?.required_relations],['relations applied',a?.applied_relations],['view',a?.applied_viewpoint]].forEach(([k,v])=>m.append(kv(k,v)));const ib=$('#issues');ib.innerHTML='';for(const i of a?.issues||[]){const e=document.createElement('div');e.className='issue';e.textContent=i.code+' ['+i.severity+'] '+i.detail;ib.append(e)}$('#state').textContent=d.accepted?'ACCEPTED':'NOT ACCEPTED';$('#state').className='badge '+(d.accepted?'ok':'bad')}catch(e){alert(e.message)}finally{b.disabled=false}};
</script></main></body></html>
