name: V87.38 Native Raster Verify

on:
  push:
    branches:
      - feature/v87-38-native-raster
      - main
    paths:
      - "releases/v87_38/**"
      - "fap_v87_38_native_unified_chat_gateway.py"
      - "BUILD_FAP_V87_38_NATIVE_RASTER.cmd"
      - "RUN_FAP_CHAT_LATEST.cmd"
      - ".github/workflows/v87-38-native-raster-verify.yml"
  pull_request:
    paths:
      - "releases/v87_38/**"
      - "fap_v87_38_native_unified_chat_gateway.py"
      - "BUILD_FAP_V87_38_NATIVE_RASTER.cmd"
      - "RUN_FAP_CHAT_LATEST.cmd"
      - ".github/workflows/v87-38-native-raster-verify.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Build native C99 core
        run: python releases/v87_38/native_raster/build_native.py --force
      - name: Compile Python bridge
        run: |
          python -m py_compile releases/v87_38/native_raster/fap_native_raster/loader.py
          python -m py_compile releases/v87_38/native_raster/fap_native_raster/renderer.py
          python -m py_compile fap_v87_38_native_unified_chat_gateway.py
      - name: Run V87.38 tests
        env:
          PYTHONPATH: .:releases/v82/adaptive_circuits:releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_33/object_registry:releases/v87_34/scene_graph2:releases/v87_35/morphology:releases/v87_36/scientific_geometry:releases/v87_37/sparse_execution:releases/v87_38/native_raster
        run: pytest -q releases/v87_38/native_raster/tests
      - name: Run V87.37 regression
        env:
          PYTHONPATH: .:releases/v82/adaptive_circuits:releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_33/object_registry:releases/v87_34/scene_graph2:releases/v87_35/morphology:releases/v87_36/scientific_geometry:releases/v87_37/sparse_execution
        run: pytest -q releases/v87_37/sparse_execution/tests
      - name: Benchmark native vs Python
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_33/object_registry:releases/v87_34/scene_graph2:releases/v87_35/morphology:releases/v87_36/scientific_geometry:releases/v87_37/sparse_execution:releases/v87_38/native_raster
        run: python releases/v87_38/native_raster/benchmark_native.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - name: Build native DLL
        run: python releases/v87_38/native_raster/build_native.py --force
      - name: Native smoke on Windows
        shell: pwsh
        env:
          PYTHONPATH: releases/v87_13/media_generation;releases/v87_15/observed_media;releases/v87_16/media_portfolio;releases/v87_17/adaptive_fast_path;releases/v87_19/autonomous_media;releases/v87_20/media_lab;releases/v87_29/native_image;releases/v87_30/human_lbs;releases/v87_31/scene_image;releases/v87_32/photo_look;releases/v87_33/object_registry;releases/v87_34/scene_graph2;releases/v87_35/morphology;releases/v87_36/scientific_geometry;releases/v87_37/sparse_execution;releases/v87_38/native_raster
        run: python -m pytest -q releases/v87_38/native_raster/tests/test_native_core.py
