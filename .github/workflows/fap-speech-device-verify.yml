name: FAP Speech Device Compatibility

on:
  push:
    branches:
      - feature/universal-fap-speech-io
    paths:
      - "fap_speech.py"
      - "fap_speech_fluent.py"
      - "fap_audio_device.py"
      - "tests/test_fap_speech.py"
      - "tests/test_fap_speech_fluent.py"
      - "tests/test_fap_audio_device.py"
      - ".github/workflows/fap-speech-device-verify.yml"
  pull_request:
    paths:
      - "fap_speech.py"
      - "fap_speech_fluent.py"
      - "fap_audio_device.py"
      - "tests/test_fap_speech.py"
      - "tests/test_fap_speech_fluent.py"
      - "tests/test_fap_audio_device.py"
      - ".github/workflows/fap-speech-device-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile speech modules
        run: python -m py_compile fap_speech.py fap_speech_fluent.py fap_audio_device.py
      - name: Core speech tests
        run: python tests/test_fap_speech.py
      - name: Fluent conversation tests
        run: python tests/test_fap_speech_fluent.py
      - name: Device compatibility tests
        run: python tests/test_fap_audio_device.py
