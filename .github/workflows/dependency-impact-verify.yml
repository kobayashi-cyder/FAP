name: FAP dependency-aware test selection verify

on:
  push:
    branches:
      - feature/v87-81-dependency-impact-mainline
      - main
    paths:
      - "fap_repository_impact.py"
      - "fap_repository_test_selector.py"
      - "tests/test_fap_repository_impact.py"
      - "tests/test_fap_repository_test_selector.py"
      - ".github/workflows/dependency-impact-verify.yml"
  pull_request:
    paths:
      - "fap_repository_impact.py"
      - "fap_repository_test_selector.py"
      - "tests/test_fap_repository_impact.py"
      - "tests/test_fap_repository_test_selector.py"
      - ".github/workflows/dependency-impact-verify.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q fap_repository_impact.py fap_repository_test_selector.py
      - run: python -m unittest tests.test_fap_repository_impact tests.test_fap_repository_test_selector -v
