name: Public r001 Adaptive Reasoning Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fap_revision_r001.py'
      - 'tests/test_fap_revision_r001.py'
      - 'VERSION'
      - '.github/workflows/public-r001-adaptive-reasoning-verify.yml'
  pull_request:
    paths:
      - 'fap_revision_r001.py'
      - 'tests/test_fap_revision_r001.py'
      - 'VERSION'
      - '.github/workflows/public-r001-adaptive-reasoning-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify r001 module is retained
        run: test -s fap_revision_r001.py
      - name: Run focused regression tests
        run: python -m unittest -v tests.test_fap_revision_r001
