name: FAP FCA AST repair sync verify

on:
  push:
    branches:
      - feature/fca-ast-repair-sync
      - main
    paths:
      - "fap_repository_ast_patch.py"
      - "tests/test_fap_repository_ast_patch.py"
      - "fap_repository_agent.py"
      - "fap_repository_executor.py"
      - "fap_repository_verifier.py"
      - ".github/workflows/fca-ast-repair-sync.yml"
  pull_request:
    paths:
      - "fap_repository_ast_patch.py"
      - "tests/test_fap_repository_ast_patch.py"
      - "fap_repository_agent.py"
      - "fap_repository_executor.py"
      - "fap_repository_verifier.py"
      - ".github/workflows/fca-ast-repair-sync.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile AST repair boundary
        run: |
          python -m compileall -q \
            fap_repository_ast_patch.py \
            fap_repository_agent.py \
            fap_repository_executor.py \
            fap_repository_verifier.py

      - name: Run AST repair sync tests
        run: python -m unittest tests.test_fap_repository_ast_patch -v

      - name: Run existing repository coding regressions
        run: |
          python -m unittest tests.test_fap_repository_executor -v
          python -m unittest tests.test_fap_repository_verifier -v
          python -m unittest tests.test_fap_repository_agent -v
          python -m unittest tests.test_fap_fca_repository_exchange -v

      - name: Verify FCA remains optional
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("fap_repository_ast_patch.py").read_text(encoding="utf-8")
          assert "import fca" not in source
          assert "from fca" not in source
          PY
