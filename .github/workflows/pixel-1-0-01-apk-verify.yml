name: Pixel 1.0.01 APK Verify

on:
  push:
    branches:
      - "side/1.0.01-pixel-*"
    paths:
      - "android/**"
      - "android_packaging/sync_pixel_runtime.py"
      - "android_packaging/generate_pixel_update_manifest.py"
      - "android_packaging/tests/test_generate_pixel_update_manifest.py"
      - "pixel_update/**"
      - "fap_*.py"
      - "knowledge/**"
      - ".github/workflows/pixel-1-0-01-apk-verify.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - "android_packaging/sync_pixel_runtime.py"
      - "android_packaging/generate_pixel_update_manifest.py"
      - "android_packaging/tests/test_generate_pixel_update_manifest.py"
      - "pixel_update/**"
      - "fap_*.py"
      - "knowledge/**"
      - ".github/workflows/pixel-1-0-01-apk-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-1-0-01-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pixel-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Verify current local 1.x runtime
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile fap_1x_standard_runtime.py
          python - <<'PY'
          from fap_1x_standard_runtime import FAP1xStandardRuntime
          runtime = FAP1xStandardRuntime(root=".")
          status = runtime.status()
          assert status["version"] == "1.0.01"
          assert "factual-qa" in status["capabilities"]
          print(status)
          PY

      - name: Verify Git OTA manifest generator
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v android_packaging.tests.test_generate_pixel_update_manifest
          python android_packaging/generate_pixel_update_manifest.py \
            --repo-root . \
            --source-commit "$GITHUB_SHA" \
            --output /tmp/pixel-latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path("pixel_update/latest.json").read_text(encoding="utf-8"))
          assert current["schema"] == "fap.pixel.runtime.manifest.v1"
          assert current["entrypoint"] == "fap_1x_standard_runtime.py"
          assert current["file_count"] == len(current["files"])
          assert sum(x["bytes"] for x in current["files"]) == current["total_bytes"]
          paths = {x["path"] for x in current["files"]}
          assert "fap_speech.py" in paths
          assert "fap_1x_standard_runtime.py" in paths
          print("published manifest:", current["source_commit"], current["file_count"], current["total_bytes"])
          PY

      - name: Build minimal Pixel Python payload
        shell: bash
        run: |
          set -euo pipefail
          DEST="android/app/src/main/python"
          REPORT="android/pixel-runtime-manifest.json"
          python android_packaging/sync_pixel_runtime.py             --repo-root .             --dest "$DEST"             --report "$REPORT"

          cat > "$DEST/build_meta.py" <<PY
          RELEASE_VERSION = "1.0.01"
          MAIN_SHA = "${GITHUB_SHA}"
          PY

          python -m compileall -q "$DEST"
          cat "$REPORT"

      - name: Build Pixel debug APK
        working-directory: android
        env:
          FAP_VERSION_CODE: "10001"
          FAP_VERSION_NAME: "1.0.01-pixel"
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p pixel-apk
          cp "$APK" pixel-apk/FAP-Pixel-1.0.01-debug.apk
          cp android/pixel-runtime-manifest.json pixel-apk/pixel-runtime-manifest.json
          cp pixel_update/latest.json pixel-apk/git-ota-latest.json
          sha256sum pixel-apk/FAP-Pixel-1.0.01-debug.apk | tee pixel-apk/SHA256.txt
          unzip -p "$APK" 'classes*.dex' | strings > pixel-apk/dex-strings.txt
          grep -q 'PixelBrowserAccessibilityService' pixel-apk/dex-strings.txt
          grep -q 'PixelBrowserController' pixel-apk/dex-strings.txt
          grep -q 'GitRuntimeUpdater' pixel-apk/dex-strings.txt
          grep -q 'AndroidVoiceController' pixel-apk/dex-strings.txt
          grep -q 'ChatLogStore' pixel-apk/dex-strings.txt
          grep -q 'AgentOrchestrator' pixel-apk/dex-strings.txt
          test -s android/app/src/main/java/jp/fap/runtime/FapTimelineView.java
          test -s android/app/src/main/java/jp/fap/runtime/GitContextProvider.java
          grep -q 'startContinuous' android/app/src/main/java/jp/fap/runtime/AndroidVoiceController.java
          grep -q 'barge-in ready' android/app/src/main/java/jp/fap/runtime/AndroidVoiceController.java
          grep -q 'renderTimeline' android/app/src/main/java/jp/fap/runtime/FapTimelineView.java
          grep -q 'agentHeartbeat' android/app/src/main/java/jp/fap/runtime/PixelBrowserAccessibilityService.java
          grep -q 'run_agent' android/app/src/main/python/android_bridge.py
          grep -q 'durable_chat_log' android/app/src/main/python/android_bridge.py
          grep -q 'validate_runtime' android/app/src/main/python/android_bridge.py
          test -s android/app/src/main/python/fap_speech.py
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'PixelBrowserAccessibilityService' android/app/src/main/AndroidManifest.xml

      - name: Upload Pixel APK
        uses: actions/upload-artifact@v4
        with:
          name: FAP-Pixel-1.0.01-${{ github.sha }}
          path: pixel-apk/
          if-no-files-found: error
          retention-days: 30
