name: JSON config edit

on:
  push:
    branches:
      - promote/json-config-safe-20260924
  pull_request:
    paths:
      - "fap_repository_json_edit.py"
      - "tests/test_fap_repository_json_edit.py"
      - ".github/workflows/json-config-edit.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q fap_repository_json_edit.py
      - run: python -m unittest tests.test_fap_repository_json_edit -v
