name: FAP V87.73 exponential-linear verify

on:
  push:
    branches:
      - feature/v87-73-exponential-linear-fabric
      - main
    paths:
      - "fap_exponential_linear.py"
      - "fap_interaction_fabric.py"
      - "fap_repository_interaction.py"
      - "fap_v87_73_exponential_linear_gateway.py"
      - "fap_repository_*.py"
      - "tests/test_fap_exponential_linear.py"
      - "tests/test_fap_interaction_fabric.py"
      - "tests/test_fap_repository_interaction.py"
      - "RUN_FAP_CHAT_LATEST.*"
      - ".github/workflows/v87-73-exponential-linear-verify.yml"
  pull_request:
    paths:
      - "fap_exponential_linear.py"
      - "fap_interaction_fabric.py"
      - "fap_repository_interaction.py"
      - "fap_v87_73_exponential_linear_gateway.py"
      - "fap_repository_*.py"
      - "tests/test_fap_exponential_linear.py"
      - "tests/test_fap_interaction_fabric.py"
      - "tests/test_fap_repository_interaction.py"
      - "RUN_FAP_CHAT_LATEST.*"
      - ".github/workflows/v87-73-exponential-linear-verify.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile V87.73 stack
        run: |
          python -m compileall -q             fap_exponential_linear.py             fap_interaction_fabric.py             fap_repository_interaction.py             fap_v87_73_exponential_linear_gateway.py
      - name: Run V87.73 focused tests
        run: |
          python -m unittest tests.test_fap_exponential_linear -v
          python -m unittest tests.test_fap_interaction_fabric -v
          python -m unittest tests.test_fap_repository_interaction -v
      - name: Run repository coding regression
        run: |
          python -m unittest discover -s tests -p "test_fap_repository_*.py" -v
      - name: Smoke latest gateway
        run: |
          python - <<'PY'
          import fap_v87_73_exponential_linear_gateway as g
          status = g.CORE.chat_status()
          assert status.get("version") == "87.73-unified-chat", status
          fabric = g.CORE.status().get("interaction_fabric") or {}
          assert fabric.get("enabled") is True, fabric
          assert fabric.get("fca_required") is False, fabric
          assert "legacy_chat" in fabric.get("endpoints", []), fabric
          PY
