name: V87.32 Unified Chat Verify

on:
  push:
    branches:
      - fix/latest-chat-v87-32
      - main
    paths:
      - "fap_v87_32_unified_chat_gateway.py"
      - "RUN_FAP_V87_32_CHAT.cmd"
      - "RUN_FAP_CHAT_LATEST.cmd"
      - "tests/test_v87_32_unified_chat.py"
      - ".github/workflows/v87-32-unified-chat-verify.yml"
  pull_request:
    paths:
      - "fap_v87_32_unified_chat_gateway.py"
      - "RUN_FAP_V87_32_CHAT.cmd"
      - "RUN_FAP_CHAT_LATEST.cmd"
      - "tests/test_v87_32_unified_chat.py"
      - ".github/workflows/v87-32-unified-chat-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Compile unified gateway
        run: python -m py_compile fap_v87_32_unified_chat_gateway.py
      - name: Unified chat regression
        run: pytest -q tests/test_v87_32_unified_chat.py
      - name: Preserve chat-speed regression
        run: pytest -q tests/test_speed_restore.py tests/test_v87_12_semantic_adaptive.py
