name: Chat Speed Restore Verify

on:
  push:
    branches:
      - perf/restore-chat-speed
      - main
    paths:
      - "fap_v87_10_program_synth_gateway.py"
      - "fap_v87_12_semantic_adaptive_gateway.py"
      - "fap_sol_gap_controller.py"
      - "fap_semantic_memory.py"
      - "fap_v87_25_structured_reasoning_gateway.py"
      - "fap_v87_26_scientific_reasoning_gateway.py"
      - "fap_v87_27_physics_knowledge_gateway.py"
      - "fap_v87_28_physics_solver_gateway.py"
      - "tests/test_speed_restore.py"
      - ".github/workflows/chat-speed-restore-verify.yml"
  pull_request:
    paths:
      - "fap_v87_10_program_synth_gateway.py"
      - "fap_v87_12_semantic_adaptive_gateway.py"
      - "fap_sol_gap_controller.py"
      - "fap_semantic_memory.py"
      - "tests/test_speed_restore.py"
      - ".github/workflows/chat-speed-restore-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Compile modified hot-path modules
        run: |
          python -m py_compile fap_v87_10_program_synth_gateway.py
          python -m py_compile fap_v87_12_semantic_adaptive_gateway.py
          python -m py_compile fap_sol_gap_controller.py
          python -m py_compile fap_semantic_memory.py
          python -m py_compile fap_v87_25_structured_reasoning_gateway.py
          python -m py_compile fap_v87_26_scientific_reasoning_gateway.py
          python -m py_compile fap_v87_27_physics_knowledge_gateway.py
          python -m py_compile fap_v87_28_physics_solver_gateway.py
      - name: Speed regression tests
        run: pytest -q tests/test_speed_restore.py
      - name: V87.10-V87.12 regressions
        run: pytest -q tests/test_v87_10_program_synth.py tests/test_v87_11_sol_gap.py tests/test_v87_12_semantic_adaptive.py
