name: FAP V87.76 session-continuity verify

on:
  push:
    branches:
      - feature/v87-76-adaptive-session-continuity
      - main
    paths:
      - "fap_session_continuity.py"
      - "fap_v87_75_semantic_fabric_gateway.py"
      - "fap_v87_76_session_continuity_gateway.py"
      - "tests/test_fap_session_continuity.py"
      - "tests/test_v87_76_session_gateway.py"
      - "RUN_FAP_CHAT_LATEST.*"
      - ".github/workflows/v87-76-session-continuity-verify.yml"
  pull_request:
    paths:
      - "fap_session_continuity.py"
      - "fap_v87_75_semantic_fabric_gateway.py"
      - "fap_v87_76_session_continuity_gateway.py"
      - "tests/test_fap_session_continuity.py"
      - "tests/test_v87_76_session_gateway.py"
      - "RUN_FAP_CHAT_LATEST.*"
      - ".github/workflows/v87-76-session-continuity-verify.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile V87.76
        run: |
          python -m compileall -q             fap_session_continuity.py             fap_v87_75_semantic_fabric_gateway.py             fap_v87_76_session_continuity_gateway.py
      - name: Run continuity regressions
        run: |
          python -m unittest tests.test_fap_session_continuity -v
          python -m unittest tests.test_v87_76_session_gateway -v
          python -m unittest tests.test_fap_semantic_fabric -v
          python -m unittest tests.test_fap_interaction_fabric -v
          python -m unittest tests.test_fap_interaction_chain -v
      - name: Smoke V87.76
        run: |
          python - <<'PY'
          import fap_v87_76_session_continuity_gateway as g
          status = g.CORE.chat_status()
          assert status.get("version") == "87.76-unified-chat", status
          full = g.CORE.status()
          session = full.get("session_continuity") or {}
          assert session.get("enabled") is True, session
          assert session.get("existing_persistent_message_store_reused") is True, session
          assert session.get("new_message_store_added") is False, session
          assert session.get("route_ledger_stores_message_text") is False, session
          assert session.get("fca_required") is False, session
          PY
