name: Official 2026 Common Test English Reading

on:
  workflow_dispatch:
  push:
    branches:
      - 'side/public-1.0.01-r002-port-20260926'
    paths:
      - 'benchmarks/common_test_official_2026_reading.py'
      - '.github/workflows/official-2026-common-test-reading.yml'
      - 'fap_*.py'

permissions:
  contents: read

jobs:
  official-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install pypdf cryptography fonttools
      - name: Run official 2026 English Reading benchmark
        run: python benchmarks/common_test_official_2026_reading.py
      - name: Upload score report
        uses: actions/upload-artifact@v4
        with:
          name: fap-official-r8-reading-report
          path: runtime/official_r8_reading_report.json
          retention-days: 30
