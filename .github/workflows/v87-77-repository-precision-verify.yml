name: FAP V87.77 repository-precision verify

on:
  push:
    branches:
      - feature/v87-77-repository-context-precision
      - main
    paths:
      - "fap_repository_reader.py"
      - "fap_repository_planner.py"
      - "fap_v87_77_repository_precision_gateway.py"
      - "tests/test_fap_repository_planner.py"
      - "RUN_FAP_CHAT_LATEST.*"
      - ".github/workflows/v87-77-repository-precision-verify.yml"
  pull_request:
    paths:
      - "fap_repository_reader.py"
      - "fap_repository_planner.py"
      - "fap_v87_77_repository_precision_gateway.py"
      - "tests/test_fap_repository_planner.py"
      - "RUN_FAP_CHAT_LATEST.*"
      - ".github/workflows/v87-77-repository-precision-verify.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile repository stack
        run: |
          python -m compileall -q             fap_repository_reader.py             fap_repository_planner.py             fap_v87_77_repository_precision_gateway.py
      - name: Run repository precision tests
        run: |
          python -m unittest tests.test_fap_repository_planner -v
          python -m unittest discover -s tests -p "test_fap_repository_*.py" -v
      - name: Run interaction regressions
        run: |
          python -m unittest tests.test_fap_session_continuity -v
          python -m unittest tests.test_fap_semantic_fabric -v
      - name: Smoke V87.77
        run: |
          python - <<'PY'
          import fap_v87_77_repository_precision_gateway as g
          status = g.CORE.chat_status()
          assert status.get("version") == "87.77-unified-chat", status
          precision = g.CORE.status().get("repository_precision") or {}
          assert precision.get("enabled") is True, precision
          assert precision.get("dependency_context_write_target") is False, precision
          assert precision.get("delete_requires_explicit_existing_path") is True, precision
          assert precision.get("fca_required") is False, precision
          PY
