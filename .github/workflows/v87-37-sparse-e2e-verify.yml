name: V87.37 Sparse End-to-End Verify

on:
  push:
    branches:
      - feature/v87-37-sparse-e2e
      - main
    paths:
      - "releases/v87_37/**"
      - "fap_v87_37_sparse_unified_chat_gateway.py"
      - "RUN_FAP_CHAT_LATEST.cmd"
      - ".github/workflows/v87-37-sparse-e2e-verify.yml"
  pull_request:
    paths:
      - "releases/v87_37/**"
      - "fap_v87_37_sparse_unified_chat_gateway.py"
      - "RUN_FAP_CHAT_LATEST.cmd"
      - ".github/workflows/v87-37-sparse-e2e-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Compile V87.37
        run: |
          python -m py_compile releases/v87_37/sparse_execution/fap_sparse_execution/routing.py
          python -m py_compile releases/v87_37/sparse_execution/fap_sparse_execution/renderer.py
          python -m py_compile fap_v87_37_sparse_unified_chat_gateway.py
      - name: Run V87.37 sparse execution tests
        env:
          PYTHONPATH: .:releases/v82/adaptive_circuits:releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_33/object_registry:releases/v87_34/scene_graph2:releases/v87_35/morphology:releases/v87_36/scientific_geometry:releases/v87_37/sparse_execution
        run: pytest -q releases/v87_37/sparse_execution/tests
      - name: Run V87.36 regression
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_36/scientific_geometry
        run: pytest -q releases/v87_36/scientific_geometry/tests
      - name: Run V87.35 regression
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_33/object_registry:releases/v87_34/scene_graph2:releases/v87_35/morphology
        run: pytest -q releases/v87_35/morphology/tests
