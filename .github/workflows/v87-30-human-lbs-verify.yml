name: V87.30 Human LBS Verify

on:
  push:
    branches:
      - feature/v87-30-human-lbs
      - main
    paths:
      - "releases/v87_30/**"
      - "fap_v87_30_lbs_image_lab.py"
      - "fap_v87_30_lbs_demo.py"
      - "RUN_FAP_V87_30_LBS_IMAGE_LAB.cmd"
      - "RUN_FAP_V87_30_LBS_DEMO.cmd"
      - ".github/workflows/v87-30-human-lbs-verify.yml"
  pull_request:
    paths:
      - "releases/v87_30/**"
      - "fap_v87_30_lbs_image_lab.py"
      - "fap_v87_30_lbs_demo.py"
      - "RUN_FAP_V87_30_LBS_IMAGE_LAB.cmd"
      - "RUN_FAP_V87_30_LBS_DEMO.cmd"
      - ".github/workflows/v87-30-human-lbs-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Compile V87.30
        run: |
          python -m py_compile releases/v87_30/human_lbs/fap_human_lbs/core.py
          python -m py_compile releases/v87_30/human_lbs/fap_human_lbs/engine.py
          python -m py_compile releases/v87_30/human_lbs/fap_human_lbs/manager.py
          python -m py_compile fap_v87_30_lbs_image_lab.py
          python -m py_compile fap_v87_30_lbs_demo.py
      - name: Run V87.30 focused tests
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_30/human_lbs
        run: pytest -q releases/v87_30/human_lbs/tests
