name: FAP V87.70 repository coding coordinator verify

on:
  push:
    branches:
      - feature/v87-70-repository-coding-coordinator
    paths:
      - "fap_repository_agent.py"
      - "fap_repository_promotion.py"
      - "fap_repository_verifier.py"
      - "fap_repository_executor.py"
      - "tests/test_fap_repository_agent.py"
      - ".github/workflows/v87-70-repository-coding-coordinator-verify.yml"
  pull_request:
    paths:
      - "fap_repository_agent.py"
      - "fap_repository_promotion.py"
      - "fap_repository_verifier.py"
      - "fap_repository_executor.py"
      - "tests/test_fap_repository_agent.py"
      - ".github/workflows/v87-70-repository-coding-coordinator-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Compile repository coding stack
        run: |
          python -m compileall -q fap_repository_index.py fap_repository_reader.py fap_repository_planner.py fap_repository_executor.py fap_repository_verifier.py fap_repository_promotion.py fap_repository_agent.py
      - name: Run repository coding regression
        run: |
          python -m unittest discover -s tests -p "test_fap_repository_index.py" -v
          python -m unittest discover -s tests -p "test_fap_repository_planner.py" -v
          python -m unittest discover -s tests -p "test_fap_repository_executor.py" -v
          python -m unittest discover -s tests -p "test_fap_repository_verifier.py" -v
          python -m unittest discover -s tests -p "test_fap_repository_promotion.py" -v
          python -m unittest discover -s tests -p "test_fap_repository_agent.py" -v
