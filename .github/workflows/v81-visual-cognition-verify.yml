name: V81 Visual Cognition Verify

on:
  push:
    branches: ["feature/v81-visual-ir-vision-loop"]
  pull_request:
    paths:
      - "releases/v81/**"
      - "releases/v79/**"
      - "FAP_LATEST.md"
      - "releases/README.md"
      - ".github/workflows/v81-visual-cognition-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile V81
        run: python -m compileall -q releases/v81/visual_cognition
      - name: V81 visual cognition tests
        run: python -m unittest discover -s releases/v81/visual_cognition/tests -p "test_*.py" -v
      - name: V80/V79 creativity and primitive-invention regressions
        run: python -m unittest discover -s releases/v79/creativity_engine/tests -p "test_*.py" -v
