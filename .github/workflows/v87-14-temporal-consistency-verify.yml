name: V87.14 Temporal Consistency Verify

on:
  push:
    branches:
      - v87.14-temporal-consistency
      - main
    paths:
      - "releases/v87_14/**"
      - "releases/v87_13/media_generation/**"
      - ".github/workflows/v87-14-temporal-consistency-verify.yml"
  pull_request:
    paths:
      - "releases/v87_14/**"
      - "releases/v87_13/media_generation/**"
      - ".github/workflows/v87-14-temporal-consistency-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Run V87.14 tests
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_14/video_temporal
        run: pytest -q releases/v87_14/video_temporal/tests
