name: V81 Self Curriculum Verify

on:
  push:
    branches: ["feature/v81-self-curriculum"]
  pull_request:
    paths:
      - "releases/v81/**"
      - "releases/v79/creativity_engine/**"
      - "releases/v78/**"
      - "FAP_LATEST.md"
      - ".github/workflows/v81-self-curriculum-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile V78-V81
        run: >-
          python -m compileall -q
          releases/v81/self_curriculum
          releases/v79/creativity_engine
          releases/v78/learning_integration
      - name: V81 self-curriculum tests
        run: python -m unittest discover -s releases/v81/self_curriculum/tests -p "test_*.py" -v
      - name: V79 creativity and V80 primitive-loop regressions
        run: python -m unittest discover -s releases/v79/creativity_engine/tests -p "test_*.py" -v
      - name: V78 learning regressions
        run: python -m unittest discover -s releases/v78/learning_integration/tests -p "test_*.py" -v
