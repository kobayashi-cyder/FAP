name: V87.57 Generic Derivation Verify

on:
  push:
    paths:
      - "fap_generic_derivation.py"
      - "fap_v87_57_generic_derivation_gateway.py"
      - "knowledge/math_derivations_ja.jsonl"
      - "tests/test_generic_derivation.py"
      - "fap_v87_10_program_synth_gateway.py"
      - "fap_v87_12_semantic_adaptive_gateway.py"
      - "RUN_FAP_CHAT_LATEST.ps1"
      - "RUN_FAP_CHAT_LATEST.sh"
      - ".github/workflows/v87-57-generic-derivation-verify.yml"
  pull_request:
    paths:
      - "fap_generic_derivation.py"
      - "fap_v87_57_generic_derivation_gateway.py"
      - "knowledge/math_derivations_ja.jsonl"
      - "tests/test_generic_derivation.py"
      - "fap_v87_10_program_synth_gateway.py"
      - "fap_v87_12_semantic_adaptive_gateway.py"
      - "RUN_FAP_CHAT_LATEST.ps1"
      - "RUN_FAP_CHAT_LATEST.sh"
      - ".github/workflows/v87-57-generic-derivation-verify.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile generic derivation stack
        run: |
          python -m py_compile fap_generic_derivation.py fap_v87_57_generic_derivation_gateway.py
      - name: Run generic derivation tests
        run: |
          python -m unittest tests.test_generic_derivation -v
