name: V87.13 Media Generation Verify

on:
  push:
    branches:
      - v87.13-media-generation
      - main
    paths:
      - "releases/v87_13/**"
      - ".github/workflows/v87-13-media-generation-verify.yml"
  pull_request:
    paths:
      - "releases/v87_13/**"
      - ".github/workflows/v87-13-media-generation-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Run V87.13 tests
        env:
          PYTHONPATH: releases/v87_13/media_generation
        run: pytest -q releases/v87_13/media_generation/tests
