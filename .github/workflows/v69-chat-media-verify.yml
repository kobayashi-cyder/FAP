name: V69 Chat Media Verify

on:
  push:
    branches:
      - feature/v69-chat-media-surface
  pull_request:
    paths:
      - "releases/v69/interaction/**"
      - "releases/v69/*CHAT_MEDIA*"
      - ".github/workflows/v69-chat-media-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile V69 interaction
        run: python -m compileall -q releases/v69/interaction
      - name: Focused V69 tests
        run: python -m unittest discover -s releases/v69/interaction/tests -p "test_*.py" -v
      - name: V66-V68 core cumulative regression
        working-directory: releases/v68
        run: |
          python -m unittest discover -s tests -p "test_v66_operational.py" -v
          python -m unittest discover -s tests -p "test_v67_code_factory.py" -v
          python -m unittest discover -s tests -p "test_v68_code_factory.py" -v
