name: Public r002 Final Two Verify

on:
  workflow_dispatch:
  push:
    branches:
      - 'side/public-1.0.01-r002-port-20260926'
    paths:
      - 'fap_v87_10_program_synth_gateway.py'
      - 'fap_v87_41_low_latency_chat_gateway.py'
      - 'fap_inquiry_engine.py'
      - 'fap_reflective_conversation.py'
      - 'fap_session_continuity.py'
      - 'fap_v87_76_session_continuity_gateway.py'
      - 'tests/test_factual_chat_regression.py'
      - 'tests/test_v87_78_conversation_fuzz_gateway.py'
      - '.github/workflows/public-r002-final-two.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest psutil
      - name: Verify descendant fast-status isolation
        run: pytest -q tests/test_factual_chat_regression.py
      - name: Verify long conversation fuzz without artificial per-file cutoff
        run: pytest -q tests/test_v87_78_conversation_fuzz_gateway.py
