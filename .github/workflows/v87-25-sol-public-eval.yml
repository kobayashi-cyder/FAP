name: V87.25 Sol Public Eval

on:
  push:
    branches:
      - v87.25-structured-reasoning
    paths:
      - "benchmarks/sol_gpqa_v8725.py"
      - "fap_benchmark_reasoning.py"
      - "fap_v87_25_structured_reasoning_gateway.py"
      - ".github/workflows/v87-25-sol-public-eval.yml"
  workflow_dispatch:

jobs:
  gpqa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FAP_TEACHER_FALLBACK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GPQA Diamond
        run: python benchmarks/sol_gpqa_v8725.py
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: v87-25-sol-public-eval
          path: benchmark_results/
