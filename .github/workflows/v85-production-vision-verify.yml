name: V85 Production Vision Verify

on:
  push:
    branches: ["feature/v85-production-vision-wiring"]
  pull_request:
    paths:
      - "releases/v85/**"
      - "releases/v84/**"
      - "releases/v83/**"
      - "releases/v82/**"
      - "releases/v81/**"
      - "releases/v79/creativity_engine/**"
      - "releases/v78/**"
      - "FAP_LATEST.md"
      - "releases/README.md"
      - ".github/workflows/v85-production-vision-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile V78-V85
        run: >-
          python -m compileall -q
          releases/v85/production_vision
          releases/v84/self_curriculum
          releases/v83/visual_cognition
          releases/v82/adaptive_circuits
          releases/v81/local_adaptation
          releases/v79/creativity_engine
          releases/v78/learning_integration
      - name: V85 production Vision tests
        run: python -m unittest discover -s releases/v85/production_vision/tests -p "test_*.py" -v
      - name: V84 self-curriculum regressions
        run: python -m unittest discover -s releases/v84/self_curriculum/tests -p "test_*.py" -v
      - name: V83 visual cognition regressions
        run: python -m unittest discover -s releases/v83/visual_cognition/tests -p "test_*.py" -v
      - name: V82 adaptive circuit regressions
        run: python -m unittest discover -s releases/v82/adaptive_circuits/tests -p "test_*.py" -v
      - name: V81 local adaptation regressions
        run: python -m unittest discover -s releases/v81/local_adaptation/tests -p "test_*.py" -v
      - name: V79 creativity/primitive regressions
        run: python -m unittest discover -s releases/v79/creativity_engine/tests -p "test_*.py" -v
      - name: V78 learning regressions
        run: python -m unittest discover -s releases/v78/learning_integration/tests -p "test_*.py" -v
