name: V87.21 Local Image Engine Verify

on:
  push:
    branches:
      - v87.21-local-image-engine
      - main
    paths:
      - "releases/v87_21/**"
      - "fap_v87_21_media_lab.py"
      - "RUN_FAP_V87_21_LOCAL_MEDIA_LAB.cmd"
      - "START_EXISTING_A1111_FOR_FAP.cmd"
      - ".github/workflows/v87-21-local-image-engine-verify.yml"
  pull_request:
    paths:
      - "releases/v87_21/**"
      - "fap_v87_21_media_lab.py"
      - "RUN_FAP_V87_21_LOCAL_MEDIA_LAB.cmd"
      - "START_EXISTING_A1111_FOR_FAP.cmd"
      - ".github/workflows/v87-21-local-image-engine-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Run V87.21 tests
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_21/local_engine
        run: pytest -q releases/v87_21/local_engine/tests
