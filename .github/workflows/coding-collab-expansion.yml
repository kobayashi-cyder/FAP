name: Coding collaboration expansion

on:
  push:
    branches:
      - collab/coding-expansion-v8780
    paths:
      - "fap_repository_structured_patch.py"
      - "fap_repository_structured_planner.py"
      - "fap_repository_collab.py"
      - "tests/test_fap_repository_structured_patch.py"
      - "tests/test_fap_repository_structured_planner.py"
      - "tests/test_fap_repository_collab.py"
      - "fap_repository_ast_patch.py"
      - "fap_repository_planner.py"
      - "fap_repository_agent.py"
      - "fap_repository_interaction.py"
      - "docs/CODING_COLLAB_V8780.md"
      - ".github/workflows/coding-collab-expansion.yml"
  pull_request:
    paths:
      - "fap_repository_structured_patch.py"
      - "fap_repository_structured_planner.py"
      - "fap_repository_collab.py"
      - "tests/test_fap_repository_structured_patch.py"
      - "tests/test_fap_repository_structured_planner.py"
      - "tests/test_fap_repository_collab.py"
      - "fap_repository_ast_patch.py"
      - "fap_repository_planner.py"
      - "fap_repository_agent.py"
      - "fap_repository_interaction.py"
      - "docs/CODING_COLLAB_V8780.md"
      - ".github/workflows/coding-collab-expansion.yml"

jobs:
  coding-expansion:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile coding expansion
        run: |
          python -m compileall -q \
            fap_repository_structured_patch.py \
            fap_repository_structured_planner.py \
            fap_repository_collab.py
      - name: Run coding expansion and repository regressions
        run: |
          python -m unittest \
            tests.test_fap_repository_structured_patch \
            tests.test_fap_repository_structured_planner \
            tests.test_fap_repository_collab \
            tests.test_fap_repository_ast_patch \
            tests.test_fap_repository_planner \
            tests.test_fap_repository_agent \
            tests.test_fap_repository_interaction -v
