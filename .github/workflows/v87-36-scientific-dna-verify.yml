name: V87.36 Scientific DNA Verify

on:
  push:
    branches:
      - feature/v87-36-scientific-dna
      - main
    paths:
      - "releases/v87_36/**"
      - "fap_v87_36_scientific_dna_lab.py"
      - "RUN_FAP_V87_36_SCIENTIFIC_DNA_LAB.cmd"
      - "web/FAP_Media_Lab_V87_36_DNA.html"
      - "fap_v87_36_unified_chat_gateway.py"
      - "RUN_FAP_CHAT_LATEST.cmd"
      - ".github/workflows/v87-36-scientific-dna-verify.yml"
  pull_request:
    paths:
      - "releases/v87_36/**"
      - "fap_v87_36_scientific_dna_lab.py"
      - "RUN_FAP_V87_36_SCIENTIFIC_DNA_LAB.cmd"
      - "web/FAP_Media_Lab_V87_36_DNA.html"
      - "fap_v87_36_unified_chat_gateway.py"
      - "RUN_FAP_CHAT_LATEST.cmd"
      - ".github/workflows/v87-36-scientific-dna-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Compile V87.36
        run: |
          python -m py_compile releases/v87_36/scientific_geometry/fap_scientific_geometry/dna.py
          python -m py_compile releases/v87_36/scientific_geometry/fap_scientific_geometry/engine.py
          python -m py_compile releases/v87_36/scientific_geometry/fap_scientific_geometry/critic.py
          python -m py_compile releases/v87_36/scientific_geometry/fap_scientific_geometry/manager.py
          python -m py_compile releases/v87_36/scientific_geometry/fap_scientific_geometry/runtime.py
          python -m py_compile fap_v87_36_scientific_dna_lab.py
          if [ -f fap_v87_36_unified_chat_gateway.py ]; then python -m py_compile fap_v87_36_unified_chat_gateway.py; fi
      - name: Run V87.36 tests
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_36/scientific_geometry
        run: pytest -q releases/v87_36/scientific_geometry/tests
      - name: Run V87.35 regression
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_33/object_registry:releases/v87_34/scene_graph2:releases/v87_35/morphology
        run: pytest -q releases/v87_35/morphology/tests
