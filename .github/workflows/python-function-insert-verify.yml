name: FAP Python function insert verify

on:
  push:
    branches:
      - feature/v87-81-python-function-insert-mainline
      - main
    paths:
      - "fap_repository_python_insert.py"
      - "tests/test_fap_repository_python_insert.py"
      - ".github/workflows/python-function-insert-verify.yml"
  pull_request:
    paths:
      - "fap_repository_python_insert.py"
      - "tests/test_fap_repository_python_insert.py"
      - ".github/workflows/python-function-insert-verify.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q fap_repository_python_insert.py
      - run: python -m unittest tests.test_fap_repository_python_insert -v
