name: V87.33 Object Registry Verify

on:
  push:
    branches:
      - feature/v87-33-object-registry
      - main
    paths:
      - "releases/v87_33/**"
      - "fap_v87_33_object_registry_lab.py"
      - "fap_v87_33_object_registry_demo.py"
      - "RUN_FAP_V87_33_OBJECT_REGISTRY_LAB.cmd"
      - "web/FAP_Media_Lab_V87_33.html"
      - ".github/workflows/v87-33-object-registry-verify.yml"
  pull_request:
    paths:
      - "releases/v87_33/**"
      - "fap_v87_33_object_registry_lab.py"
      - "fap_v87_33_object_registry_demo.py"
      - "RUN_FAP_V87_33_OBJECT_REGISTRY_LAB.cmd"
      - "web/FAP_Media_Lab_V87_33.html"
      - ".github/workflows/v87-33-object-registry-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Compile V87.33
        run: |
          python -m py_compile releases/v87_33/object_registry/fap_object_registry/registry.py
          python -m py_compile releases/v87_33/object_registry/fap_object_registry/engine.py
          python -m py_compile releases/v87_33/object_registry/fap_object_registry/critic.py
          python -m py_compile releases/v87_33/object_registry/fap_object_registry/manager.py
          python -m py_compile releases/v87_33/object_registry/fap_object_registry/runtime.py
          python -m py_compile fap_v87_33_object_registry_lab.py
          python -m py_compile fap_v87_33_object_registry_demo.py
      - name: Run V87.33 tests
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_33/object_registry
        run: pytest -q releases/v87_33/object_registry/tests
      - name: Run V87.32 regression
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look
        run: pytest -q releases/v87_32/photo_look/tests
      - name: Generate bird-dog sample
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_33/object_registry
        run: python fap_v87_33_object_registry_demo.py
      - name: Upload bird-dog sample
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: V87_33_BIRD_DOG_SAMPLE
          path: runtime/v87_33_bird_dog_demo/
          if-no-files-found: error
