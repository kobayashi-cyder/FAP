name: V76 Android Python Packaging Verify

on:
  push:
    branches:
      - feature/v76-android-python-packaging
  pull_request:
    paths:
      - "android_packaging/**"
      - "releases/v76/**"
      - ".github/workflows/build-android-apk.yml"
      - ".github/workflows/v76-android-python-packaging-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile packaging tool and interaction packages
        run: python -m compileall -q android_packaging releases/v75/managed_chat releases/v74/gated_runtime releases/v73/provider_probe releases/v72/audio_lifecycle releases/v71/runtime releases/v70/media_adapters releases/v69/interaction
      - name: V76 packaging unit tests
        run: python -m unittest discover -s android_packaging/tests -p "test_*.py" -v
      - name: Sync actual manifest and compile packaged assets
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          mkdir -p "${TMP}/python"
          python android_packaging/sync_python_packages.py \
            --repo-root . \
            --dest "${TMP}/python" \
            --manifest android_packaging/python_packages.json \
            --report "${TMP}/interaction_packages.json"
          python -m compileall -q "${TMP}/python"
          for package in fap_interaction fap_provider_adapters fap_runtime fap_audio_lifecycle fap_provider_probe fap_gated_runtime fap_managed_chat; do
            test -f "${TMP}/python/${package}/__init__.py"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          report = json.loads((Path(os.environ["TMP_REPORT"]) if "TMP_REPORT" in os.environ else Path("/nonexistent")).read_text()) if False else None
          PY
      - name: V75 regression
        run: python -m unittest discover -s releases/v75/managed_chat/tests -p "test_*.py" -v
      - name: V74 regression
        run: python -m unittest discover -s releases/v74/gated_runtime/tests -p "test_*.py" -v
      - name: V73 regression
        run: python -m unittest discover -s releases/v73/provider_probe/tests -p "test_*.py" -v
      - name: V72 regression
        run: python -m unittest discover -s releases/v72/audio_lifecycle/tests -p "test_*.py" -v
      - name: V71 regression
        run: python -m unittest discover -s releases/v71/runtime/tests -p "test_*.py" -v
      - name: V70 regression
        run: python -m unittest discover -s releases/v70/media_adapters/tests -p "test_*.py" -v
      - name: V69 regression
        run: python -m unittest discover -s releases/v69/interaction/tests -p "test_*.py" -v
      - name: V66-V68 core regression
        working-directory: releases/v68
        run: |
          python -m unittest discover -s tests -p "test_v66_operational.py" -v
          python -m unittest discover -s tests -p "test_v67_code_factory.py" -v
          python -m unittest discover -s tests -p "test_v68_code_factory.py" -v
