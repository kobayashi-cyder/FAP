name: Horizontal coding benchmark

on:
  push:
    branches:
      - horiz/coding-benchmark
  pull_request:
    paths:
      - "fap_repository_benchmark.py"
      - "tests/test_fap_repository_benchmark.py"
      - ".github/workflows/horiz-coding-benchmark.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q fap_repository_benchmark.py
      - run: python -m unittest tests.test_fap_repository_benchmark -v
