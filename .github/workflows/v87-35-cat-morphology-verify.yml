name: V87.35 Cat Morphology Verify

on:
  push:
    branches:
      - feature/v87-35-cat-morphology
      - main
    paths:
      - "releases/v87_35/**"
      - ".github/workflows/v87-35-cat-morphology-verify.yml"
  pull_request:
    paths:
      - "releases/v87_35/**"
      - ".github/workflows/v87-35-cat-morphology-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Compile V87.35
        run: |
          python -m py_compile releases/v87_35/morphology/fap_morphology/pattern.py
          python -m py_compile releases/v87_35/morphology/fap_morphology/engine.py
          python -m py_compile releases/v87_35/morphology/fap_morphology/critic.py
          python -m py_compile releases/v87_35/morphology/fap_morphology/manager.py
      - name: Run V87.35 tests
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_33/object_registry:releases/v87_34/scene_graph2:releases/v87_35/morphology
        run: pytest -q releases/v87_35/morphology/tests
      - name: Run V87.34 regression
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_33/object_registry:releases/v87_34/scene_graph2
        run: pytest -q releases/v87_34/scene_graph2/tests
