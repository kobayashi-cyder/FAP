name: FAP structured shell block verify

on:
  push:
    branches:
      - feature/v87-81-shell-block-mainline
      - main
    paths:
      - "fap_repository_shell_edit.py"
      - "fap_repository_structured_patch.py"
      - "tests/test_fap_repository_shell_edit.py"
      - "tests/test_fap_repository_structured_patch.py"
      - ".github/workflows/shell-block-verify.yml"
  pull_request:
    paths:
      - "fap_repository_shell_edit.py"
      - "fap_repository_structured_patch.py"
      - "tests/test_fap_repository_shell_edit.py"
      - "tests/test_fap_repository_structured_patch.py"
      - ".github/workflows/shell-block-verify.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q fap_repository_shell_edit.py fap_repository_structured_patch.py
      - run: python -m unittest tests.test_fap_repository_shell_edit tests.test_fap_repository_structured_patch -v
