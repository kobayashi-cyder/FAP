name: V87.34 Scene Graph 2 Verify

on:
  push:
    branches:
      - feature/v87-34-scene-graph2
      - main
    paths:
      - "releases/v87_34/**"
      - "fap_v87_34_scene_graph2_lab.py"
      - "RUN_FAP_V87_34_SCENE_GRAPH2_LAB.cmd"
      - "web/FAP_Media_Lab_V87_34.html"
      - "fap_v87_34_unified_chat_gateway.py"
      - "RUN_FAP_CHAT_LATEST.cmd"
      - ".github/workflows/v87-34-scene-graph2-verify.yml"
  pull_request:
    paths:
      - "releases/v87_34/**"
      - "fap_v87_34_scene_graph2_lab.py"
      - "RUN_FAP_V87_34_SCENE_GRAPH2_LAB.cmd"
      - "web/FAP_Media_Lab_V87_34.html"
      - ".github/workflows/v87-34-scene-graph2-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Compile V87.34
        run: |
          python -m py_compile releases/v87_34/scene_graph2/fap_scene_graph2/graph.py
          python -m py_compile releases/v87_34/scene_graph2/fap_scene_graph2/engine.py
          python -m py_compile releases/v87_34/scene_graph2/fap_scene_graph2/critic.py
          python -m py_compile releases/v87_34/scene_graph2/fap_scene_graph2/manager.py
          python -m py_compile releases/v87_34/scene_graph2/fap_scene_graph2/runtime.py
          python -m py_compile fap_v87_34_scene_graph2_lab.py
          python -m py_compile fap_v87_34_unified_chat_gateway.py
      - name: Run V87.34 tests
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_33/object_registry:releases/v87_34/scene_graph2
        run: pytest -q releases/v87_34/scene_graph2/tests
      - name: Run V87.33 regression
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path:releases/v87_19/autonomous_media:releases/v87_20/media_lab:releases/v87_29/native_image:releases/v87_30/human_lbs:releases/v87_31/scene_image:releases/v87_32/photo_look:releases/v87_33/object_registry
        run: pytest -q releases/v87_33/object_registry/tests
