name: V71 Interaction Runtime Verify

on:
  push:
    branches:
      - feature/v71-interaction-runtime
  pull_request:
    paths:
      - "releases/v71/runtime/**"
      - "releases/v71/*INTERACTION_RUNTIME*"
      - ".github/workflows/v71-interaction-runtime-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile V71 runtime
        run: python -m compileall -q releases/v71/runtime releases/v70/media_adapters releases/v69/interaction
      - name: V71 focused tests
        run: python -m unittest discover -s releases/v71/runtime/tests -p "test_*.py" -v
      - name: V70 adapter regression
        run: python -m unittest discover -s releases/v70/media_adapters/tests -p "test_*.py" -v
      - name: V69 interaction regression
        run: python -m unittest discover -s releases/v69/interaction/tests -p "test_*.py" -v
      - name: V66-V68 core cumulative regression
        working-directory: releases/v68
        run: |
          python -m unittest discover -s tests -p "test_v66_operational.py" -v
          python -m unittest discover -s tests -p "test_v67_code_factory.py" -v
          python -m unittest discover -s tests -p "test_v68_code_factory.py" -v
