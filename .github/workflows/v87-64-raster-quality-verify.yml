name: V87.64 Raster Quality Verify

on:
  push:
    paths:
      - "fap_local_image_backend.py"
      - "fap_v87_64_raster_quality_gateway.py"
      - "fap_v87_10_program_synth_gateway.py"
      - "knowledge/visual_concepts_ja.jsonl"
      - "tests/test_local_raster_image.py"
      - "RUN_FAP_CHAT_LATEST.sh"
      - "RUN_FAP_CHAT_LATEST.ps1"
      - ".github/workflows/v87-64-raster-quality-verify.yml"
  pull_request:
    paths:
      - "fap_local_image_backend.py"
      - "fap_v87_64_raster_quality_gateway.py"
      - "fap_v87_10_program_synth_gateway.py"
      - "knowledge/visual_concepts_ja.jsonl"
      - "tests/test_local_raster_image.py"
      - "RUN_FAP_CHAT_LATEST.sh"
      - "RUN_FAP_CHAT_LATEST.ps1"
      - ".github/workflows/v87-64-raster-quality-verify.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check launcher syntax
        run: sh -n RUN_FAP_CHAT_LATEST.sh
      - name: Compile raster quality stack
        run: |
          python -m py_compile fap_local_image_backend.py fap_v87_64_raster_quality_gateway.py
      - name: Safe-mode gateway preflight
        run: |
          PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 python -S -B -c 'import fap_v87_64_raster_quality_gateway as g; s=g.CORE.chat_status(); assert s.get("version") == "87.64-unified-chat", s'
      - name: Run raster quality regression tests
        run: python -m unittest tests.test_local_raster_image -v
