name: Official 2026 Common Test Probe

on:
  workflow_dispatch:
  push:
    branches:
      - 'side/public-1.0.01-r002-port-20260926'
    paths:
      - 'benchmarks/common_test_official_2026_probe.py'
      - '.github/workflows/official-2026-common-test-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf cryptography
      - run: python benchmarks/common_test_official_2026_probe.py
