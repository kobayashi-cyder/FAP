name: V87.60 Relevance Isolation Verify

on:
  push:
    paths:
      - "fap_inquiry_engine.py"
      - "fap_sol_gap_controller.py"
      - "fap_v87_12_semantic_adaptive_gateway.py"
      - "fap_v87_60_relevance_isolation_gateway.py"
      - "tests/test_relevance_isolation.py"
      - "RUN_FAP_CHAT_LATEST.ps1"
      - "RUN_FAP_CHAT_LATEST.sh"
      - ".github/workflows/v87-60-relevance-isolation-verify.yml"
  pull_request:
    paths:
      - "fap_inquiry_engine.py"
      - "fap_sol_gap_controller.py"
      - "fap_v87_12_semantic_adaptive_gateway.py"
      - "fap_v87_60_relevance_isolation_gateway.py"
      - "tests/test_relevance_isolation.py"
      - "RUN_FAP_CHAT_LATEST.ps1"
      - "RUN_FAP_CHAT_LATEST.sh"
      - ".github/workflows/v87-60-relevance-isolation-verify.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile relevance isolation stack
        run: |
          python -m py_compile fap_inquiry_engine.py fap_sol_gap_controller.py fap_v87_12_semantic_adaptive_gateway.py fap_v87_60_relevance_isolation_gateway.py
      - name: Run relevance isolation tests
        run: |
          python -m unittest tests.test_relevance_isolation -v
