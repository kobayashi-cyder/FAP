name: Cleanup legacy non-1.x tags

on:
  push:
    branches:
      - side/1.0.01-clean-integration-20260926
    paths:
      - .github/workflows/cleanup-legacy-tags.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete non-1.x tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/tags?per_page=100" --jq '.[].name' > /tmp/tags.txt
          echo "Tags before cleanup:"
          cat /tmp/tags.txt || true
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            case "$tag" in
              1.*|v1.*)
                echo "keep: $tag"
                ;;
              *)
                ref=$(jq -rn --arg v "tags/$tag" '$v|@uri')
                echo "delete: $tag"
                gh api --method DELETE "repos/$REPO/git/refs/$ref"
                ;;
            esac
          done < /tmp/tags.txt
          echo "Tags after cleanup:"
          gh api --paginate "repos/$REPO/tags?per_page=100" --jq '.[].name'
