name: Build Public FAP 1.0.01 Android Adapter

on:
  push:
    branches:
      - 'side/public-1.0.01-android-voice-port-*'
    paths:
      - 'android-v59/**'
      - '.github/workflows/android-v59-apk.yml'
  pull_request:
    branches:
      - main
      - side/public-1.0.01-integration-20260926
    paths:
      - 'android-v59/**'
      - '.github/workflows/android-v59-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Ensure Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager=""
          for candidate in             "$sdk_root/cmdline-tools/latest/bin/sdkmanager"             "$sdk_root/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              sdkmanager="$candidate"
              break
            fi
          done
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            echo "[ERROR] sdkmanager not found under $sdk_root/cmdline-tools"
            find "$sdk_root" -maxdepth 4 -name sdkmanager -print || true
            exit 2
          fi
          echo "[INFO] sdkmanager=$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platforms;android-37' 'build-tools;36.0.0'
      - name: Build debug APK
        run: gradle -p android-v59 :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FAP-1.0.01-Android-debug
          path: android-v59/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
