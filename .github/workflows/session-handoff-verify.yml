name: FAP repository session handoff verify

on:
  push:
    branches:
      - feature/v87-81-session-handoff-mainline
      - main
    paths:
      - "fap_repository_session_handoff.py"
      - "tests/test_fap_repository_session_handoff.py"
      - ".github/workflows/session-handoff-verify.yml"
  pull_request:
    paths:
      - "fap_repository_session_handoff.py"
      - "tests/test_fap_repository_session_handoff.py"
      - ".github/workflows/session-handoff-verify.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q fap_repository_session_handoff.py
      - run: python -m unittest tests.test_fap_repository_session_handoff -v
