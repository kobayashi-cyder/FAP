name: V87.17 Adaptive Fast Path Verify

on:
  push:
    branches:
      - v87.17-adaptive-fast-path
      - main
    paths:
      - "releases/v87_17/**"
      - "releases/v87_13/media_generation/**"
      - "releases/v87_15/observed_media/**"
      - "releases/v87_16/media_portfolio/**"
      - ".github/workflows/v87-17-adaptive-fast-path-verify.yml"
  pull_request:
    paths:
      - "releases/v87_17/**"
      - "releases/v87_13/media_generation/**"
      - "releases/v87_15/observed_media/**"
      - "releases/v87_16/media_portfolio/**"
      - ".github/workflows/v87-17-adaptive-fast-path-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Run V87.17 tests
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media:releases/v87_16/media_portfolio:releases/v87_17/adaptive_fast_path
        run: pytest -q releases/v87_17/adaptive_fast_path/tests
