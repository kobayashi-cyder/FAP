name: V70 Media Provider Verify

on:
  push:
    branches:
      - feature/v70-media-provider-adapters
  pull_request:
    paths:
      - "releases/v70/media_adapters/**"
      - "releases/v70/*MEDIA_ADAPTERS*"
      - ".github/workflows/v70-media-provider-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile V70 adapters
        run: python -m compileall -q releases/v70/media_adapters releases/v69/interaction
      - name: V70 focused tests
        run: python -m unittest discover -s releases/v70/media_adapters/tests -p "test_*.py" -v
      - name: V69 interaction regression
        run: python -m unittest discover -s releases/v69/interaction/tests -p "test_*.py" -v
      - name: V66-V68 core cumulative regression
        working-directory: releases/v68
        run: |
          python -m unittest discover -s tests -p "test_v66_operational.py" -v
          python -m unittest discover -s tests -p "test_v67_code_factory.py" -v
          python -m unittest discover -s tests -p "test_v68_code_factory.py" -v
