name: v87-51-mainline-verify

on:
  push:
    branches: [main]
    paths:
      - "fap_epistemic_learning.py"
      - "fap_inquiry_engine.py"
      - "fap_knowledge_retrieval.py"
      - "fap_v87_48_epistemic_learning_gateway.py"
      - "fap_scientific_modeling.py"
      - "fap_v87_49_scientific_modeling_gateway.py"
      - "fap_v87_50_recent_science_gateway.py"
      - "fap_v87_51_literature_appraisal_gateway.py"
      - "knowledge/scientific_models_ja.jsonl"
      - "knowledge/latest_science_2026.jsonl"
      - "tests/test_epistemic_learning.py"
      - ".github/workflows/v87-48-epistemic-learning-verify.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile V87.48 modules
        run: |
          python -m py_compile             fap_epistemic_learning.py             fap_knowledge_retrieval.py             fap_inquiry_engine.py             fap_scientific_modeling.py             fap_v87_48_epistemic_learning_gateway.py             fap_v87_49_scientific_modeling_gateway.py             fap_v87_50_recent_science_gateway.py \
            fap_v87_51_literature_appraisal_gateway.py
      - name: Epistemic learning regression tests
        run: python -m unittest -v tests.test_epistemic_learning
