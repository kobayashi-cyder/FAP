name: FAP repository security preflight verify

on:
  push:
    branches:
      - feature/v87-81-security-preflight-mainline
      - main
    paths:
      - "fap_repository_security_policy.py"
      - "fap_repository_agent.py"
      - "tests/test_fap_repository_security_policy.py"
      - "tests/test_fap_repository_agent.py"
      - ".github/workflows/security-preflight-verify.yml"
  pull_request:
    paths:
      - "fap_repository_security_policy.py"
      - "fap_repository_agent.py"
      - "tests/test_fap_repository_security_policy.py"
      - "tests/test_fap_repository_agent.py"
      - ".github/workflows/security-preflight-verify.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q fap_repository_security_policy.py fap_repository_agent.py
      - run: python -m unittest tests.test_fap_repository_security_policy tests.test_fap_repository_agent -v
