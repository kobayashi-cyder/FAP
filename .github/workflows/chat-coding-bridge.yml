name: Repository chat coding bridge

on:
  pull_request:
    paths:
      - "fap_repository_chat_bridge.py"
      - "fap_repository_chat_coding.py"
      - "tests/test_fap_repository_chat_bridge.py"
      - "tests/test_fap_repository_chat_coding.py"
      - ".github/workflows/chat-coding-bridge.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q fap_repository_chat_bridge.py fap_repository_chat_coding.py
      - run: python -m unittest tests.test_fap_repository_chat_bridge tests.test_fap_repository_chat_coding -v
