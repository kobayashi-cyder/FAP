name: FAP V87.74 interaction-chain verify

on:
  push:
    branches:
      - feature/v87-74-cooperative-interaction-chain
      - main
    paths:
      - "fap_interaction_fabric.py"
      - "fap_interaction_chain.py"
      - "fap_v87_74_interaction_chain_gateway.py"
      - "tests/test_fap_interaction_chain.py"
      - "RUN_FAP_CHAT_LATEST.*"
      - ".github/workflows/v87-74-interaction-chain-verify.yml"
  pull_request:
    paths:
      - "fap_interaction_fabric.py"
      - "fap_interaction_chain.py"
      - "fap_v87_74_interaction_chain_gateway.py"
      - "tests/test_fap_interaction_chain.py"
      - "RUN_FAP_CHAT_LATEST.*"
      - ".github/workflows/v87-74-interaction-chain-verify.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile interaction chain
        run: |
          python -m compileall -q             fap_exponential_linear.py             fap_interaction_fabric.py             fap_interaction_chain.py             fap_v87_74_interaction_chain_gateway.py
      - name: Run interaction regressions
        run: |
          python -m unittest tests.test_fap_exponential_linear -v
          python -m unittest tests.test_fap_interaction_fabric -v
          python -m unittest tests.test_fap_interaction_chain -v
          python -m unittest tests.test_fap_repository_interaction -v
      - name: Smoke V87.74
        run: |
          python - <<'PY'
          import fap_v87_74_interaction_chain_gateway as g
          status = g.CORE.chat_status()
          assert status.get("version") == "87.74-unified-chat", status
          full = g.CORE.status()
          chain = full.get("interaction_chain") or {}
          assert chain.get("enabled") is True, chain
          assert chain.get("automatic_default_chat_chaining") is False, chain
          assert chain.get("fca_required") is False, chain
          PY
