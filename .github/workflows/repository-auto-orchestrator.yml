name: Repository auto coding orchestrator

on:
  push:
    branches:
      - horiz/repository-auto-orchestrator-20260924
    paths:
      - "fap_repository_auto_orchestrator.py"
      - "tests/test_fap_repository_auto_orchestrator.py"
      - ".github/workflows/repository-auto-orchestrator.yml"
  pull_request:
    paths:
      - "fap_repository_auto_orchestrator.py"
      - "tests/test_fap_repository_auto_orchestrator.py"
      - ".github/workflows/repository-auto-orchestrator.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q fap_repository_auto_orchestrator.py tests/test_fap_repository_auto_orchestrator.py
      - run: python -m unittest tests.test_fap_repository_auto_orchestrator -v
