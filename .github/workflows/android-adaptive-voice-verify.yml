name: Android Adaptive Voice Verify

on:
  push:
    branches:
      - feature/android-adaptive-voice
    paths:
      - "android-v59/app/src/main/AndroidManifest.xml"
      - "android-v59/app/src/main/java/jp/fap/v59/MainActivity.java"
      - "android-v59/app/src/main/java/jp/fap/v59/AndroidVoiceController.java"
      - ".github/workflows/android-adaptive-voice-verify.yml"
  pull_request:
    branches:
      - android-v59
    paths:
      - "android-v59/app/src/main/AndroidManifest.xml"
      - "android-v59/app/src/main/java/jp/fap/v59/MainActivity.java"
      - "android-v59/app/src/main/java/jp/fap/v59/AndroidVoiceController.java"
      - ".github/workflows/android-adaptive-voice-verify.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Compile Android adaptive voice
        working-directory: android-v59
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
