name: Android Adaptive Voice Verify

on:
  push:
    branches:
      - 'side/public-1.0.01-android-voice-port-*'
    paths:
      - "android-v59/**"
      - ".github/workflows/android-adaptive-voice-verify.yml"
      - "scripts/check_version_consistency.py"
      - "tests/test_public_release_contract.py"
  pull_request:
    branches: [main]
    paths:
      - "android-v59/**"
      - ".github/workflows/android-adaptive-voice-verify.yml"
      - "scripts/check_version_consistency.py"
      - "tests/test_public_release_contract.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Compile Android adaptive voice
        working-directory: android-v59
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
      - name: Verify public 1.0.01 contract remains intact
        run: |
          python scripts/check_version_consistency.py
          python -m unittest -v tests.test_public_release_contract
