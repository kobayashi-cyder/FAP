name: V87.58 Generic Rule Reasoning Verify

on:
  push:
    paths:
      - "fap_generic_rule_reasoner.py"
      - "fap_v87_58_generic_rule_gateway.py"
      - "knowledge/core_rule_graph_ja.jsonl"
      - "tests/test_generic_rule_reasoning.py"
      - "fap_v87_10_program_synth_gateway.py"
      - "fap_v87_12_semantic_adaptive_gateway.py"
      - "RUN_FAP_CHAT_LATEST.ps1"
      - "RUN_FAP_CHAT_LATEST.sh"
      - ".github/workflows/v87-58-generic-rule-reasoning-verify.yml"
  pull_request:
    paths:
      - "fap_generic_rule_reasoner.py"
      - "fap_v87_58_generic_rule_gateway.py"
      - "knowledge/core_rule_graph_ja.jsonl"
      - "tests/test_generic_rule_reasoning.py"
      - "fap_v87_10_program_synth_gateway.py"
      - "fap_v87_12_semantic_adaptive_gateway.py"
      - "RUN_FAP_CHAT_LATEST.ps1"
      - "RUN_FAP_CHAT_LATEST.sh"
      - ".github/workflows/v87-58-generic-rule-reasoning-verify.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile generic rule stack
        run: |
          python -m py_compile fap_generic_rule_reasoner.py fap_v87_58_generic_rule_gateway.py
      - name: Run generic rule reasoning tests
        run: |
          python -m unittest tests.test_generic_rule_reasoning -v
