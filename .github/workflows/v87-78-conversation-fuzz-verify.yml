name: FAP V87.78 conversation-fuzz verify

on:
  push:
    branches:
      - feature/v87-78-conversation-fuzz-hardening
      - main
    paths:
      - "fap_conversation_fuzz.py"
      - "fap_interaction_fabric.py"
      - "fap_session_continuity.py"
      - "fap_semantic_conversation.py"
      - "fap_semantic_action_router.py"
      - "tests/test_fap_conversation_fuzz.py"
      - "tests/test_v87_78_conversation_fuzz_gateway.py"
      - "fap_v87_77_repository_precision_gateway.py"
      - "fap_v87_78_conversation_fuzz_gateway.py"
      - "RUN_FAP_CHAT_LATEST.*"
      - "FAP_LATEST.md"
      - ".github/workflows/v87-78-conversation-fuzz-verify.yml"
  pull_request:
    paths:
      - "fap_conversation_fuzz.py"
      - "tests/test_v87_78_conversation_fuzz_gateway.py"
      - "fap_v87_77_repository_precision_gateway.py"
      - "fap_interaction_fabric.py"
      - "fap_session_continuity.py"
      - "fap_semantic_conversation.py"
      - "fap_semantic_action_router.py"
      - "tests/test_fap_conversation_fuzz.py"
      - "fap_v87_78_conversation_fuzz_gateway.py"
      - "RUN_FAP_CHAT_LATEST.*"
      - "FAP_LATEST.md"
      - ".github/workflows/v87-78-conversation-fuzz-verify.yml"

jobs:
  fuzz:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile conversation fuzz stack
        run: |
          python -m compileall -q \
            fap_conversation_fuzz.py \
            fap_interaction_fabric.py \
            fap_session_continuity.py \
            fap_semantic_conversation.py \
            fap_semantic_action_router.py \
            fap_v87_78_conversation_fuzz_gateway.py
      - name: Run randomized conversation corpus
        run: |
          python -m unittest tests.test_fap_conversation_fuzz -v
          python -m unittest tests.test_v87_78_conversation_fuzz_gateway -v
      - name: Run interaction regressions
        run: |
          python -m unittest tests.test_fap_interaction_fabric -v
          python -m unittest tests.test_fap_session_continuity -v
          python -m unittest tests.test_semantic_conversation -v
          python -m unittest tests.test_semantic_action_routing -v

      - name: Smoke V87.78 latest gateway
        run: |
          python - <<'PY'
          import fap_v87_78_conversation_fuzz_gateway as g
          status = g.CORE.chat_status()
          assert status.get("version") == "87.78-unified-chat", status
          full = g.CORE.status()
          hardening = full.get("conversation_fuzz_hardening") or {}
          assert hardening.get("enabled") is True, hardening
          assert hardening.get("utterance_specific_branches_added") is False, hardening
          assert hardening.get("strict_json_safe") is True, hardening
          PY
