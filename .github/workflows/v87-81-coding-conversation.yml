name: FAP V87.81 coding-conversation consolidation

on:
  push:
    branches:
      - integration/v87-81-main-consolidation
      - main
    paths:
      - "fap_repository_*.py"
      - "fap_v87_81_coding_conversation_gateway.py"
      - "tests/test_fap_repository_*.py"
      - "tests/test_v87_81_coding_conversation_gateway.py"
      - "tests/test_fap_multiturn_consistency.py"
      - "tests/test_v87_80_multiturn_gateway.py"
      - "RUN_FAP_CHAT_LATEST.*"
      - "VERSION"
      - "FAP_LATEST.md"
      - ".github/workflows/v87-81-coding-conversation.yml"
  pull_request:
    paths:
      - "fap_repository_*.py"
      - "fap_v87_81_coding_conversation_gateway.py"
      - "tests/test_fap_repository_*.py"
      - "tests/test_v87_81_coding_conversation_gateway.py"
      - "tests/test_fap_multiturn_consistency.py"
      - "tests/test_v87_80_multiturn_gateway.py"
      - "RUN_FAP_CHAT_LATEST.*"
      - "VERSION"
      - "FAP_LATEST.md"
      - ".github/workflows/v87-81-coding-conversation.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile consolidated coding stack
        run: |
          python -m compileall -q \
            fap_repository_contracts.py \
            fap_repository_session.py \
            fap_repository_reader.py \
            fap_repository_planner.py \
            fap_repository_structured_planner.py \
            fap_repository_structured_patch.py \
            fap_repository_python_symbol_edit.py \
            fap_repository_impact.py \
            fap_repository_test_selector.py \
            fap_repository_repair_guard.py \
            fap_repository_security_policy.py \
            fap_repository_test_generation.py \
            fap_repository_agent.py \
            fap_repository_host.py \
            fap_repository_interaction.py \
            fap_v87_81_coding_conversation_gateway.py
      - name: Repository coding regressions
        run: |
          python -m unittest \
            tests.test_fap_repository_contracts \
            tests.test_fap_repository_structured_patch \
            tests.test_fap_repository_python_symbol_edit \
            tests.test_fap_repository_impact \
            tests.test_fap_repository_structured_planner \
            tests.test_fap_repository_test_selector \
            tests.test_fap_repository_repair_guard \
            tests.test_fap_repository_security_policy \
            tests.test_fap_repository_test_generation \
            tests.test_fap_repository_collab \
            tests.test_fap_repository_ast_patch \
            tests.test_fap_repository_planner \
            tests.test_fap_repository_agent \
            tests.test_fap_repository_interaction \
            tests.test_fap_repository_session_continuity -v
      - name: Conversation continuity regressions
        run: |
          python -m unittest \
            tests.test_fap_multiturn_consistency \
            tests.test_v87_80_multiturn_gateway \
            tests.test_v87_81_coding_conversation_gateway -v
