name: V87.61 Generic Recommendation Verify

on:
  push:
    paths:
      - "fap_generic_recommendation.py"
      - "fap_v87_61_generic_recommendation_gateway.py"
      - "knowledge/recommendation_framework_ja.jsonl"
      - "tests/test_generic_recommendation.py"
      - "fap_v87_10_program_synth_gateway.py"
      - "fap_v87_12_semantic_adaptive_gateway.py"
      - "RUN_FAP_CHAT_LATEST.ps1"
      - "RUN_FAP_CHAT_LATEST.sh"
      - ".github/workflows/v87-61-generic-recommendation-verify.yml"
  pull_request:
    paths:
      - "fap_generic_recommendation.py"
      - "fap_v87_61_generic_recommendation_gateway.py"
      - "knowledge/recommendation_framework_ja.jsonl"
      - "tests/test_generic_recommendation.py"
      - "fap_v87_10_program_synth_gateway.py"
      - "fap_v87_12_semantic_adaptive_gateway.py"
      - "RUN_FAP_CHAT_LATEST.ps1"
      - "RUN_FAP_CHAT_LATEST.sh"
      - ".github/workflows/v87-61-generic-recommendation-verify.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check portable launcher syntax
        run: |
          sh -n RUN_FAP_CHAT_LATEST.sh
      - name: Compile recommendation stack
        run: |
          python -m py_compile fap_generic_recommendation.py fap_v87_61_generic_recommendation_gateway.py
      - name: Safe-mode gateway preflight
        run: |
          PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 python -S -B -c 'import fap_v87_61_generic_recommendation_gateway as g; s=g.CORE.chat_status(); assert s.get("version") == "87.61-unified-chat", s'
      - name: Run recommendation regression tests
        run: |
          python -m unittest tests.test_generic_recommendation -v
