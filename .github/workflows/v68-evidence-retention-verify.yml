name: V68 Evidence Retention Verify

on:
  push:
    branches: ["skill/v68-evidence-retention"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile V68 skill
        run: python -m compileall -q releases/v68/skills/evidence_retention
      - name: V68 skill tests
        working-directory: releases/v68/skills/evidence_retention
        run: python -m unittest -v test_evidence_retention.py test_compaction_segment.py
      - name: V66 operational regression
        working-directory: releases/v66
        run: python -m unittest discover -s tests -p 'test_*.py'
