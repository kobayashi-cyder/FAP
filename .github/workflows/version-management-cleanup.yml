name: One-time version branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/version-management-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup-version-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove generated version-management branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          mapfile -t listener_branches < <(
            git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/listener/v*'
          )
          for branch in "${listener_branches[@]}"; do
            [[ -z "${branch}" ]] && continue
            echo "Deleting ${branch}"
            git push origin --delete "${branch}"
          done

          for branch in             maintenance/finalize-version-v87-80             maintenance/retire-auto-versioning             feature/v87-80-multiturn-consistency-fuzz
          do
            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              git push origin --delete "${branch}"
            fi
          done
