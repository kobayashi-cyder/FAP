name: Prepare next FAP update from main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fap-main-update-listener
  cancel-in-progress: false

jobs:
  prepare-next-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare or refresh next-release listener branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          MAIN_SHA="$(git rev-parse origin/main)"
          MAIN_SHORT="$(git rev-parse --short origin/main)"
          MAIN_MESSAGE="$(git log -1 --pretty=%s origin/main)"
          MAIN_DATE="$(git log -1 --pretty=%cI origin/main)"

          LATEST_NUM="$({
            find releases -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null || true
          } | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)"
          if [[ -z "${LATEST_NUM}" ]]; then
            LATEST_NUM=0
          fi
          NEXT_NUM=$((LATEST_NUM + 1))
          WORK_BRANCH="listener/v${NEXT_NUM}"
          RELEASE_DIR="releases/v${NEXT_NUM}"

          PREVIOUS_MAIN=""
          if git show-ref --verify --quiet "refs/remotes/origin/${WORK_BRANCH}"; then
            git checkout -B "${WORK_BRANCH}" "origin/${WORK_BRANCH}"
            if [[ -f .fap-listener/last_main_sha.txt ]]; then
              PREVIOUS_MAIN="$(tr -d '\r\n' < .fap-listener/last_main_sha.txt)"
            fi

            if ! git merge --no-edit origin/main; then
              git merge --abort || true
              echo "Could not merge main into ${WORK_BRANCH}; manual conflict resolution is required." >&2
              exit 1
            fi
          else
            git checkout -b "${WORK_BRANCH}" origin/main
            PREVIOUS_MAIN="$(git rev-parse origin/main^ 2>/dev/null || true)"
          fi

          mkdir -p .fap-listener "${RELEASE_DIR}"

          if [[ -n "${PREVIOUS_MAIN}" ]] && git cat-file -e "${PREVIOUS_MAIN}^{commit}" 2>/dev/null; then
            CHANGED_FILES="$(git diff --name-status "${PREVIOUS_MAIN}..${MAIN_SHA}" || true)"
          else
            CHANGED_FILES="$(git show --name-status --format='' "${MAIN_SHA}" || true)"
          fi

          printf '%s\n' "${MAIN_SHA}" > .fap-listener/last_main_sha.txt

          cat > .fap-listener/current.json <<EOF
          {
            "source_branch": "main",
            "source_sha": "${MAIN_SHA}",
            "source_short_sha": "${MAIN_SHORT}",
            "source_commit_date": "${MAIN_DATE}",
            "latest_release_on_main": "v${LATEST_NUM}",
            "next_release": "v${NEXT_NUM}",
            "work_branch": "${WORK_BRANCH}"
          }
          EOF

          cat > "${RELEASE_DIR}/MAIN_UPDATE_TRIGGER.md" <<EOF
          # FAP v${NEXT_NUM} update trigger

          This file is maintained automatically when \`main\` changes.

          - Source branch: \`main\`
          - Source commit: \`${MAIN_SHA}\`
          - Commit date: \`${MAIN_DATE}\`
          - Commit message: ${MAIN_MESSAGE}
          - Latest completed release detected on main: \`v${LATEST_NUM}\`
          - Prepared work branch: \`${WORK_BRANCH}\`

          ## Changes since the previous processed main state

          \`\`\`
          ${CHANGED_FILES}
          \`\`\`

          ## Next-update work contract

          1. Inspect the main change and its impact on FAP behavior, tests, packaging, and Android integration.
          2. Continue implementation only on \`${WORK_BRANCH}\` (or another non-main work branch).
          3. Add/update tests and release notes under \`${RELEASE_DIR}/\`.
          4. Do not overwrite unrelated existing work in this branch.
          5. Merge to \`main\` only after the update is coherent and verified.
          EOF

          git add .fap-listener "${RELEASE_DIR}/MAIN_UPDATE_TRIGGER.md"
          if git diff --cached --quiet; then
            echo "Listener branch already reflects main ${MAIN_SHORT}; nothing to commit."
            exit 0
          fi

          git commit -m "Prepare v${NEXT_NUM} work from main ${MAIN_SHORT}"
          git push origin HEAD:"${WORK_BRANCH}"

          echo "Prepared ${WORK_BRANCH} from main ${MAIN_SHA}"
