name: FAP native C++ verify

on:
  push:
    branches:
      - "port/public-1.0.01-cpp-native-clean-*"
    paths:
      - "native_cpp/**"
      - ".github/workflows/native-cpp-verify.yml"
  pull_request:
    branches:
      - integration/public-1.0.01-ready-20260926
    paths:
      - "native_cpp/**"
      - ".github/workflows/native-cpp-verify.yml"
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native_cpp -B build/native_cpp -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/native_cpp --parallel 2

      - name: Test
        run: ctest --test-dir build/native_cpp --output-on-failure

      - name: Verify public release contract remains intact
        run: |
          python3 scripts/check_version_consistency.py
          python3 -m unittest -v tests.test_public_release_contract tests.test_fap_revision_r001

      - name: Smoke CLI
        run: |
          ./build/native_cpp/fap_native_cli version
          ./build/native_cpp/fap_native_cli budget 0.8 1
          ./build/native_cpp/fap_native_cli analyze . "今日の天気と時刻を確認"
