name: FAP native C++ verify

on:
  push:
    branches:
      - "side/1.0.01-cpp-native-*"
    paths:
      - "native_cpp/**"
      - "fap_response_redundancy.py"
      - "fap_response_series_executor.py"
      - "fap_v87_81_coding_conversation_gateway.py"
      - "tests/test_response_redundancy.py"
      - "tests/test_response_series_executor.py"
      - "tests/test_v87_81_coding_conversation_gateway.py"
      - ".github/workflows/native-cpp-verify.yml"
  pull_request:
    paths:
      - "native_cpp/**"
      - "fap_response_redundancy.py"
      - "fap_response_series_executor.py"
      - "fap_v87_81_coding_conversation_gateway.py"
      - "tests/test_response_redundancy.py"
      - "tests/test_response_series_executor.py"
      - "tests/test_v87_81_coding_conversation_gateway.py"
      - ".github/workflows/native-cpp-verify.yml"
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native_cpp -B build/native_cpp -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/native_cpp --parallel 2

      - name: Test native
        run: ctest --test-dir build/native_cpp --output-on-failure

      - name: Test response-series execution
        run: |
          python -m unittest tests.test_response_redundancy
          python -m unittest tests.test_response_series_executor
          python -m unittest tests.test_v87_81_coding_conversation_gateway

      - name: Smoke CLI
        run: |
          ./build/native_cpp/fap_native_cli version
          ./build/native_cpp/fap_native_cli budget 0.8 1
          ./build/native_cpp/fap_native_cli analyze . "今日の天気と時刻を確認"

      - name: Verify UI JavaScript syntax
        run: node --check native_cpp/ui/app.js

      - name: Verify UI contract
        shell: bash
        run: |
          test -s native_cpp/ui/index.html
          test -s native_cpp/ui/app.css
          test -s native_cpp/ui/app.js
          test -s native_cpp/ui/build_wasm.sh
          grep -q 'fap_native_engine_analyze_json' native_cpp/ui/app.js
          grep -q 'Response lanes' native_cpp/ui/index.html
          grep -q 'Native only' native_cpp/ui/index.html
