name: Horizontal test generation

on:
  push:
    branches:
      - horiz/coding-test-generation
  pull_request:
    paths:
      - "fap_repository_test_generation.py"
      - "tests/test_fap_repository_test_generation.py"
      - ".github/workflows/horiz-test-generation.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q fap_repository_test_generation.py
      - run: python -m unittest tests.test_fap_repository_test_generation -v
