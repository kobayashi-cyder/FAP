name: V78 Teacher Learning Verify

on:
  push:
    branches: ["feature/v78-gemma4-learning-integration"]
  pull_request:
    paths:
      - "releases/v78/**"
      - "FAP_LATEST.md"
      - "releases/README.md"
      - ".github/workflows/v78-teacher-learning-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile V69-V78 stack
        run: >-
          python -m compileall -q
          releases/v78/learning_integration
          releases/v77/image_http
          releases/v75/managed_chat
          releases/v74/gated_runtime
          releases/v73/provider_probe
          releases/v72/audio_lifecycle
          releases/v71/runtime
          releases/v70/media_adapters
          releases/v69/interaction
      - name: V78 focused tests
        run: python -m unittest discover -s releases/v78/learning_integration/tests -p "test_*.py" -v
      - name: V77-V69 focused regressions
        run: |
          python -m unittest discover -s releases/v77/image_http/tests -p "test_*.py" -v
          python -m unittest discover -s releases/v75/managed_chat/tests -p "test_*.py" -v
          python -m unittest discover -s releases/v74/gated_runtime/tests -p "test_*.py" -v
          python -m unittest discover -s releases/v73/provider_probe/tests -p "test_*.py" -v
          python -m unittest discover -s releases/v72/audio_lifecycle/tests -p "test_*.py" -v
          python -m unittest discover -s releases/v71/runtime/tests -p "test_*.py" -v
          python -m unittest discover -s releases/v70/media_adapters/tests -p "test_*.py" -v
          python -m unittest discover -s releases/v69/interaction/tests -p "test_*.py" -v
      - name: V66-V68 core regressions
        working-directory: releases/v68
        run: |
          python -m unittest discover -s tests -p "test_v66_operational.py" -v
          python -m unittest discover -s tests -p "test_v67_code_factory.py" -v
          python -m unittest discover -s tests -p "test_v68_code_factory.py" -v
