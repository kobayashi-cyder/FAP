name: V87.15 Observed Media Verify

on:
  push:
    branches:
      - v87.15-observed-media-host
      - main
    paths:
      - "releases/v87_15/**"
      - "releases/v87_13/media_generation/**"
      - ".github/workflows/v87-15-observed-media-verify.yml"
  pull_request:
    paths:
      - "releases/v87_15/**"
      - "releases/v87_13/media_generation/**"
      - ".github/workflows/v87-15-observed-media-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Run V87.15 tests
        env:
          PYTHONPATH: releases/v87_13/media_generation:releases/v87_15/observed_media
        run: pytest -q releases/v87_15/observed_media/tests
