name: FAP V87.72 repository host runner verify

on:
  push:
    branches:
      - feature/v87-72-repository-host-runner
    paths:
      - "fap_repository_host.py"
      - "fap_repository_agent.py"
      - "tests/test_fap_repository_host.py"
      - ".github/workflows/v87-72-repository-host-runner-verify.yml"
  pull_request:
    paths:
      - "fap_repository_host.py"
      - "fap_repository_agent.py"
      - "tests/test_fap_repository_host.py"
      - ".github/workflows/v87-72-repository-host-runner-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Compile repository host stack
        run: |
          python -m compileall -q fap_repository_host.py fap_repository_agent.py fap_repository_executor.py fap_repository_verifier.py
      - name: Run repository host regression
        run: |
          python -m unittest discover -s tests -p "test_fap_repository_agent.py" -v
          python -m unittest discover -s tests -p "test_fap_repository_host.py" -v
