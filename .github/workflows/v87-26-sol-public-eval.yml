name: V87.26 Sol Public Eval

on:
  push:
    branches:
      - v87.26-scientific-reasoning
    paths:
      - "benchmarks/sol_gpqa_v8726.py"
      - "fap_scientific_reasoning.py"
      - "fap_v87_26_scientific_reasoning_gateway.py"
      - ".github/workflows/v87-26-sol-public-eval.yml"
  workflow_dispatch:

jobs:
  gpqa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FAP_TEACHER_FALLBACK: "0"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GPQA Diamond
        run: python benchmarks/sol_gpqa_v8726.py
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: v87-26-sol-public-eval
          path: benchmark_results/
