name: Horizontal test selection

on:
  push:
    branches:
      - horiz/coding-test-selection
  pull_request:
    paths:
      - "fap_repository_test_selector.py"
      - "tests/test_fap_repository_test_selector.py"
      - "tests/test_fap_repository_test_selector_dependency.py"
      - ".github/workflows/horiz-test-selection.yml"

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q fap_repository_test_selector.py
      - run: |
          python -m unittest \
            tests.test_fap_repository_test_selector \
            tests.test_fap_repository_test_selector_dependency -v
